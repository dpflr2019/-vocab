<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>TOEIC 단어장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="theme-color" content="#F7F6F1">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2316233F'/%3E%3Crect x='36' y='96' width='108' height='22' rx='4' fill='%23FFDF3D'/%3E%3Ctext x='90' y='86' font-family='-apple-system,sans-serif' font-size='58' font-weight='800' fill='%23fff' text-anchor='middle'%3EVo%3C/text%3E%3C/svg%3E">
<style>
:root{--miss:#C8433C;

  --ink:#16233F; --ink-soft:#5A6478; --paper:#F7F6F1; --card:#FFFFFF;
  --rule:#E2E1D8; --marker:#FFDF3D; --marker-deep:#E5BE00; --done:#1F8A63;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); padding-bottom:100px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}
header{padding:calc(22px + env(safe-area-inset-top)) 0 14px;}
h1{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 14px;}
h1 span{color:var(--ink-soft);font-weight:500;}
.count{display:flex;align-items:baseline;gap:8px;}
.count b{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;}
.count i{font-style:normal;font-size:15px;color:var(--ink-soft);}
.bar{height:10px;background:#EBEAE3;border-radius:99px;margin-top:12px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--marker);transition:width .35s ease;}
.pct{margin-top:6px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.seg{display:flex;gap:2px;background:#EBEAE3;border-radius:10px;padding:3px;margin:18px 0 12px;}
.seg button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:8px;font:600 13px inherit;font-family:inherit;color:var(--ink-soft);cursor:pointer;}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,35,63,.12);}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:8px 12px 7px;cursor:pointer;text-align:left;min-width:74px;font-family:inherit;color:inherit;}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.chip .nm{font-size:13px;font-weight:700;display:block;letter-spacing:-.01em;}
.chip .sb{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.chip.on .sb{color:rgba(255,255,255,.72);}
.chip .ln{display:block;height:3px;border-radius:2px;background:#EBEAE3;margin-top:6px;overflow:hidden;}
.chip .ln i{display:block;height:100%;background:var(--marker);}
.chip.add{display:flex;align-items:center;justify-content:center;min-width:44px;border-style:dashed;color:var(--ink-soft);font-size:18px;}
.tools{display:flex;gap:8px;align-items:center;margin:4px 0 14px;flex-wrap:wrap;}
.search{flex:1 1 140px;min-width:110px;border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:9px 11px;font-size:16px;font-family:inherit;color:var(--ink);}
.tg{border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:9px 11px;font:600 13px inherit;font-family:inherit;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.tg.on{background:var(--marker);border-color:var(--marker-deep);color:var(--ink);}
.list{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;}
.row{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--rule);align-items:flex-start;}
.row:last-child{border-bottom:0;}
.mk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);background:transparent;cursor:pointer;margin-top:2px;padding:0;position:relative;}
.mk.on{background:var(--done);border-color:var(--done);}
.mk.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg);}
.bd{flex:1;min-width:0;}
.tm{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:600;color:var(--ink-soft);border:1px solid var(--rule);border-radius:5px;padding:1px 5px;}
.tag.srs{border-color:var(--marker-deep);color:var(--marker-deep);}
.mn{font-size:14.5px;margin-top:4px;line-height:1.45;}
.ex{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.ko{font-size:12.5px;color:var(--ink-soft);opacity:.85;margin-top:4px;line-height:1.5;}
.row.known .tm{opacity:.45;} .row.known .mn,.row.known .ex,.row.known .ko{opacity:.4;}
.mask{background:var(--marker);color:transparent;border-radius:3px;cursor:pointer;}
.del{border:0;background:transparent;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:2px;font-family:inherit;}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:14px;padding:30px 20px;text-align:center;}
.empty p{margin:0 0 6px;font-size:15px;font-weight:700;}
.empty small{color:var(--ink-soft);font-size:13px;line-height:1.6;display:block;margin-bottom:16px;}
.btn{border:0;border-radius:10px;padding:12px 16px;font:700 14px inherit;font-family:inherit;cursor:pointer;background:var(--ink);color:#fff;}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule);}
.btn:disabled{opacity:.4;}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(247,246,241,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.dock div{max-width:720px;margin:0 auto;display:flex;gap:8px;}
.dock .btn{flex:1;}
.quizbtn{background:var(--marker);color:var(--ink);}
.scrim{position:fixed;inset:0;background:rgba(22,35,63,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40;}
.sheet{background:var(--paper);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.sheet h2{font-size:17px;margin:0 0 4px;letter-spacing:-.02em;}
.sheet .hint{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px;}
label.lb{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin:12px 0 6px;}
.inp,.area{width:100%;border:1px solid var(--rule);border-radius:10px;padding:11px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink);}
.area{min-height:150px;resize:vertical;line-height:1.6;}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#EBEAE3;padding:1px 4px;border-radius:4px;}
.sheet .acts{display:flex;gap:8px;margin-top:18px;}
.sheet .acts .btn{flex:1;}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.shead h2{margin:0;}
.link{border:0;background:transparent;color:var(--ink-soft);font:600 13px inherit;font-family:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0;}
.pair{display:flex;gap:8px;margin:12px 0 4px;}
.pair .inp{flex:1;min-width:0;}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}
.added{font-size:12.5px;color:var(--done);font-weight:600;margin-top:10px;min-height:16px;}
.lookup{font-size:12.5px;color:var(--ink-soft);margin-top:8px;min-height:16px;line-height:1.5;}
.lookup.ok{color:var(--done);font-weight:600;}
.warn{background:#FDF3D0;border:1px solid var(--marker-deep);border-radius:12px;padding:13px 14px;margin:12px 0 4px;font-size:13px;line-height:1.6;color:var(--ink);}
.warn b{display:block;margin-bottom:4px;font-size:13.5px;}
.warn button{margin-top:9px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:9px 12px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;}
.toast{position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;text-align:center;z-index:60;}
.quiz{position:fixed;inset:0;background:var(--ink);z-index:50;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));}
.qtop{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.7);font-size:13px;font-variant-numeric:tabular-nums;}
.qtop button{background:transparent;border:0;color:rgba(255,255,255,.7);font:14px inherit;font-family:inherit;cursor:pointer;}
.qtop .sp{margin-left:auto;}
.qbar{height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:10px;overflow:hidden;}
.qbar i{display:block;height:100%;background:var(--marker);transition:width .3s ease;}
.qcard{flex:1;margin:16px 0;background:var(--card);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow-y:auto;}
.qfront{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.25;}
.qtap{margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
.qback{border-top:1px solid var(--rule);margin-top:20px;padding-top:18px;width:100%;}
.qmean{font-size:19px;font-weight:700;line-height:1.4;}
.qex{font-size:14px;color:var(--ink-soft);margin-top:12px;line-height:1.6;}
.qko{font-size:13.5px;color:var(--ink-soft);margin-top:7px;line-height:1.6;}
.qacts{display:flex;gap:10px;}
.qacts button{flex:1;border:0;border-radius:12px;padding:16px 0;font:700 15px inherit;font-family:inherit;cursor:pointer;}
.again{background:rgba(255,255,255,.14);color:#fff;}
.got{background:var(--marker);color:var(--ink);}
.qdone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:8px;}
.qdone b{font-size:26px;letter-spacing:-.02em;}
.qdone span{color:rgba(255,255,255,.7);font-size:14px;}
.hide{display:none !important;}

.mode{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:15px 14px;margin-top:10px;font-family:inherit;color:var(--ink);cursor:pointer;}
.mode b{font-size:15px;letter-spacing:-.01em;}
.mode span{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.mode:disabled{opacity:.45;}
.p5body{flex:1;margin:16px 0;background:var(--card);border-radius:18px;padding:22px 18px;overflow-y:auto;}
.p5stem{font-size:18px;line-height:1.65;font-weight:600;letter-spacing:-.01em;}
.p5opts{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
.p5opt{width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:13px 14px;font:15px inherit;font-family:inherit;color:var(--ink);cursor:pointer;}
.p5opt b{font-weight:700;margin-right:8px;color:var(--ink-soft);}
.p5opt.right{border-color:var(--done);background:#EAF6F1;}
.p5opt.wrong{border-color:var(--miss);background:#FBECEB;}
.p5exp{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px;}
.p5verd{font-size:15px;font-weight:700;}
.p5verd.ok{color:var(--done);} .p5verd.no{color:var(--miss);}
.p5line{font-size:14px;margin-top:8px;line-height:1.6;}
.p5line.ko{color:var(--ink-soft);font-size:13.5px;}


.scards{display:flex;gap:8px;margin-top:14px;}
.scard{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:12px 8px;text-align:center;}
.scard b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.scard span{font-size:11px;color:var(--ink-soft);}
.sgrp{font-size:12px;font-weight:700;color:var(--ink-soft);margin:16px 0 8px;}
.srow{display:flex;align-items:center;gap:9px;padding:5px 0;}
.sd{font-size:12.5px;color:var(--ink-soft);width:42px;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.sd.wide{width:74px;color:var(--ink);font-weight:600;}
.sbar{flex:1;height:7px;background:#EBEAE3;border-radius:99px;overflow:hidden;min-width:40px;}
.sbar i{display:block;height:100%;background:var(--marker);}
.sv{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TOEIC 단어장 <span id="scopeLabel">· 전체</span></h1>
    <div class="count"><b id="knownN">0</b><i>/ <span id="totalN">0</span> 외움</i></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="pct" id="pctLine">0% · 남은 단어 0개</div>
    <div class="pct" id="verLine" style="margin-top:2px;opacity:.65"></div>
  </header>

  <div class="seg" id="secSeg">
    <button data-sec="v2026" class="on">2026</button>
    <button data-sec="v2023">2023</button>
    <button data-sec="colloc">Collocation</button>
  </div>

  <div class="days" id="dayRow"></div>

  <div id="warnBox"></div>

    <div class="tools hide" id="tools">
    <input class="search" id="q" placeholder="단어·뜻 검색" autocomplete="off">
    <button class="tg" id="tgMask">뜻 가리기</button>
    <button class="tg" id="tgUnknown">미암기만</button>
    <button class="tg" id="tgFill">예문 채우기</button>
    <button class="tg" id="tgExport">백업</button>
    <button class="tg" id="tgStats">기록</button>
  </div>

  <div id="listArea"></div>
</div>

<input type="file" id="restoreInput" accept=".json,application/json" style="display:none">
<div class="dock"><div>
  <button class="btn ghost" id="addBtn">단어 추가</button>
  <button class="btn quizbtn" id="startBtn">학습 시작</button>
</div></div>

<div class="scrim hide" id="scrim">
  <div class="sheet" id="sheet">
    <div class="shead">
      <h2>단어 추가</h2>
      <button class="link" id="modeBtn">여러 개 붙여넣기</button>
    </div>

    <select class="inp" id="daySel"></select>
    <input class="inp hide" id="dayName" autocomplete="off" style="margin-top:8px">

    <div id="oneMode">
      <div class="pair">
        <input class="inp" id="fTerm" placeholder="단어" autocomplete="off" autocapitalize="off">
        <input class="inp" id="fMean" placeholder="뜻" autocomplete="off">
      </div>
      <button class="link" id="moreBtn">품사·예문 넣기</button>
      <div class="lookup" id="lookupN"></div>
      <div class="hide" id="moreWrap">
        <input class="inp" id="fPos" placeholder="품사 (v., n., adj.)" autocomplete="off">
        <input class="inp" id="fEx" placeholder="예문" autocomplete="off" style="margin-top:8px">
      </div>
      <div class="added" id="addedN"></div>
      <div class="acts">
        <button class="btn ghost" id="doneAdd">닫기</button>
        <button class="btn" id="addOne" disabled>추가</button>
      </div>
    </div>

    <div id="bulkMode" class="hide">
      <p class="hint">한 줄에 한 단어씩. <span class="code">단어 | 뜻 | 품사 | 예문 | 해석</span> 순서이며 뒤쪽은 비워도 됩니다. <span class="code">[DAY 4]</span> 같은 줄이 있으면 그 DAY로 들어가고, 이미 있는 단어는 덮어씁니다.</p>
      <textarea class="area" id="bulk" placeholder="comply 준수하다
invoice 송장, 청구서
tentative 잠정적인"></textarea>
      <div class="pct" id="parsedN" style="margin-top:8px">0개 인식됨</div>
      <div class="acts">
        <button class="btn ghost" id="cancelAdd">취소</button>
        <button class="btn" id="saveAdd" disabled>저장</button>
      </div>
    </div>
  </div>
</div>



<div class="scrim hide" id="editScrim"><div class="sheet">
  <h2>단어 수정</h2>
  <p class="hint">자동으로 채워진 내용이 어색하면 직접 고치세요.</p>
  <label class="lb">단어</label><input class="inp" id="eTerm" autocomplete="off">
  <label class="lb">뜻</label><input class="inp" id="eMean" autocomplete="off">
  <label class="lb">품사</label><input class="inp" id="ePos" autocomplete="off">
  <label class="lb">예문</label><textarea class="area" id="eEx" style="min-height:70px"></textarea>
  <label class="lb">예문 해석</label><textarea class="area" id="eKo" style="min-height:70px"></textarea>
  <button class="link" id="eAuto">사전에서 예문·해석 다시 가져오기</button>
  <div class="acts">
    <button class="btn ghost" id="eDelete">삭제</button>
    <button class="btn" id="eSave">저장</button>
  </div>
</div></div>

<div class="scrim hide" id="startScrim"><div class="sheet">
  <h2>학습 시작</h2>
  <p class="hint">오늘 복습은 예정일이 된 단어만 모아 보여줍니다.</p>
  <button class="mode" data-mode="due"><b>오늘 복습</b><span id="cntDue">0개</span></button>
  <button class="mode" data-mode="flash"><b>플래시카드</b><span id="cntFlash">0개</span></button>
  <button class="mode" data-mode="part5"><b>파트5 문제</b><span id="cntP5">0문항</span></button>
  <div class="acts"><button class="btn ghost" id="startClose">닫기</button></div>
</div></div>

<div class="quiz hide" id="p5">
  <div class="qtop">
    <span id="pCount">1 / 1</span>
    <span class="sp" id="pScore">정답 0</span>
    <button id="pClose" style="margin-left:12px">닫기</button>
  </div>
  <div class="qbar"><i id="pBar" style="width:0%"></i></div>
  <div class="p5body" id="pBody"></div>
  <div class="qacts" id="pActs"></div>
</div>

<div class="quiz hide" id="quiz">
  <div class="qtop">
    <span id="qCount">1 / 1</span>
    <span id="qTally" style="opacity:.6">외움 0 · 다시 0</span>
    <button class="sp" id="qDir">영 → 한</button>
    <button id="qClose" style="margin-left:12px">닫기</button>
  </div>
  <div class="qbar"><i id="qBar" style="width:0%"></i></div>
  <div class="qcard" id="qCard"></div>
  <div class="qacts" id="qActs">
    <button class="again" id="qAgain">다시</button>
    <button class="got" id="qGot">외웠어요</button>
  </div>
</div>

<script>
"use strict";
var KEY="toeic-vocab-v1";
var uid=function(){return Math.random().toString(36).slice(2,10)};
var SAMPLE=[
 ["comply","준수하다, 따르다","v.","All vendors must comply with the new safety regulations."],
 ["invoice","송장, 청구서","n.","Please submit the invoice by the end of the month."],
 ["tentative","잠정적인, 임시의","adj.","We reached a tentative agreement on the delivery date."],
 ["reimburse","환급하다, 상환하다","v.","The company will reimburse you for travel expenses."],
 ["proficiency","숙련도, 능숙함","n.","Proficiency in Japanese is required for this position."]
];

var state={days:[],log:{},section:"v2026",day:"all",q:"",mask:false,onlyUnknown:false,revealed:{}};
var quiz=null;

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var o=JSON.parse(raw);
      state.days=o.days||[];
      state.log=o.log||{};
      var cutoff=Date.now()-400*86400000, keep={};
      Object.keys(state.log).forEach(function(k){
        var t=Date.parse(k); if(isNaN(t)||t>=cutoff) keep[k]=state.log[k];
      });
      state.log=keep;
      if(o.ui){
        if(o.ui.section) state.section=normSec(o.ui.section);
        if(o.ui.day) state.day=o.ui.day;
      }

}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var SECTIONS=[{id:"v2026",label:"2026 단어장"},{id:"v2023",label:"2023 단어장"},{id:"colloc",label:"Collocation"}];
function secLabel(id){
  for(var i=0;i<SECTIONS.length;i++) if(SECTIONS[i].id===id) return SECTIONS[i].label;
  return "2026 단어장";
}
function normSec(s){
  if(s==="colloc") return "colloc";
  if(s==="v2023") return "v2023";
  return "v2026";
}
function migrateSections(){
  var n=0;
  state.days.forEach(function(d){var v=normSec(d.section); if(d.section!==v){d.section=v;n++;}});
  if(n) save();
}
function daySort(list){
  return list.slice().sort(function(a,b){
    var na=parseInt((a.name.match(/\d+/)||[9999])[0],10);
    var nb=parseInt((b.name.match(/\d+/)||[9999])[0],10);
    if(na!==nb) return na-nb;
    var pa=(a.name.match(/\+/g)||[]).length, pb=(b.name.match(/\+/g)||[]).length;
    if(pa!==pb) return pa-pb;
    return a.name.localeCompare(b.name);
  });
}
function secDays(){return daySort(state.days.filter(function(d){return d.section===state.section}))}
function scopeWords(){
  var src=state.day==="all"?secDays():secDays().filter(function(d){return d.id===state.day});
  var out=[];
  src.forEach(function(d){d.words.forEach(function(w){out.push({w:w,dayId:d.id,dayName:d.name})})});
  return out;
}
function visibleWords(){
  var q=state.q.trim().toLowerCase();
  return scopeWords().filter(function(o){
    if(state.onlyUnknown&&o.w.known) return false;
    if(!q) return true;
    return (o.w.term+" "+o.w.meaning).toLowerCase().indexOf(q)>-1;
  });
}
function splitLine(line){
  if(/[|\t]/.test(line)) return line.split(/\s*[|\t]\s*/);
  var m=line.match(/^(.+?)\s{2,}(.+)$/); if(m) return [m[1],m[2]];
  m=line.match(/^(.+?)\s*[-–—:=]\s+(.+)$/); if(m) return [m[1],m[2]];
  m=line.match(/^([A-Za-z][A-Za-z'’\-\s]*?)\s+([^A-Za-z].*)$/); if(m) return [m[1],m[2]];
  m=line.match(/^(\S+)\s+(.+)$/); if(m) return [m[1],m[2]];
  return [line];
}
function parseGroups(text,defSec){
  var groups=[],cur=null;
  text.split("\n").forEach(function(raw){
    var line=raw.trim();
    if(!line) return;
    var h=line.match(/^\[(.+)\]$/);
    if(h){
      var label=h[1];
      var sec=defSec;
      if(/collocation/i.test(label)) sec="colloc";
      else if(/2023/.test(label)) sec="v2023";
      else if(/2026/.test(label)) sec="v2026";
      var nm=label.replace(/collocation/ig,"").replace(/2026 ?단어장|2023 ?단어장/g,"").trim();
      cur={section:sec,name:nm||"DAY 1",words:[]};
      groups.push(cur);
      return;
    }
    var p=/[|\t]/.test(line)?line.split(/\s*[|\t]\s*/):splitLine(line);
    if(!p[0]||!p[0].trim()) return;
    var w={term:p[0].trim(),meaning:(p[1]||"").trim(),pos:(p[2]||"").trim(),
           example:(p[3]||"").trim(),ko:(p[4]||"").trim()};
    if(!cur){cur={section:defSec,name:null,words:[]};groups.push(cur);}
    cur.words.push(w);
  });
  return groups.filter(function(g){return g.words.length});
}
function parseBulk(t){
  return t.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(line){
    var p=splitLine(line);
    if(!p[0]||!p[0].trim()) return null;
    return {id:uid(),term:p[0].trim(),meaning:(p[1]||"").trim(),pos:(p[2]||"").trim(),example:(p[3]||"").trim(),known:false};
  }).filter(Boolean);
}
function findWord(id){
  for(var i=0;i<state.days.length;i++){
    for(var j=0;j<state.days[i].words.length;j++){
      if(state.days[i].words[j].id===id) return state.days[i].words[j];
    }
  }
  return null;
}

function render(){
  var sc=scopeWords(), total=sc.length;
  var known=sc.filter(function(o){return o.w.known}).length;
  var pct=total?Math.round(known/total*100):0;
  var dObj=secDays().filter(function(d){return d.id===state.day})[0];
  document.getElementById("scopeLabel").textContent="· "+secLabel(state.section)+" "+(state.day==="all"?"전체":(dObj?dObj.name:"전체"));
  document.getElementById("knownN").textContent=known;
  document.getElementById("totalN").textContent=total;
  document.getElementById("barFill").style.width=pct+"%";
  document.getElementById("pctLine").textContent=pct+"% · 남은 단어 "+(total-known)+"개";
  document.getElementById("startBtn").disabled=total===0;
  document.getElementById("tools").className="tools"+(total?"":" hide");

  // day chips
  var all=secDays().reduce(function(n,d){return n+d.words.length},0);
  var html='<button class="chip'+(state.day==="all"?" on":"")+'" data-day="all"><span class="nm">전체</span><span class="sb">'+all+'개</span></button>';
  secDays().forEach(function(d){
    var k=d.words.filter(function(w){return w.known}).length;
    var p=d.words.length?(k/d.words.length*100):0;
    html+='<button class="chip'+(state.day===d.id?" on":"")+'" data-day="'+d.id+'"><span class="nm">'+esc(d.name)+'</span><span class="sb">'+k+'/'+d.words.length+'</span><span class="ln"><i style="width:'+p+'%"></i></span></button>';
  });
  html+='<button class="chip add" data-add="1" aria-label="단어 추가">+</button>';
  document.getElementById("dayRow").innerHTML=html;

  // list
  var area=document.getElementById("listArea");
  if(total===0){
    area.innerHTML='<div class="empty"><p>아직 단어가 없어요</p><small>DAY를 만들고 단어를 붙여넣으면 시작됩니다.<br>엑셀·메모에서 복사한 목록을 한 번에 넣을 수 있어요.</small><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" data-add="1">단어 추가</button><button class="btn ghost" id="sampleBtn">샘플 5개로 둘러보기</button></div></div>';
    return;
  }
  var vis=visibleWords();
  if(!vis.length){
    area.innerHTML='<div class="empty"><p>조건에 맞는 단어가 없어요</p><small>검색어를 지우거나 \'미암기만\'을 꺼보세요.</small></div>';
    return;
  }
  var rows=vis.map(function(o){
    var w=o.w;
    var mean="";
    if(w.meaning){
      mean=(state.mask&&!state.revealed[w.id])
        ? '<div class="mn"><span class="mask" data-reveal="'+w.id+'">'+esc(w.meaning)+'</span></div>'
        : '<div class="mn">'+esc(w.meaning)+'</div>';
    }
    return '<div class="row'+(w.known?" known":"")+'">'+
      '<button class="mk'+(w.known?" on":"")+'" data-toggle="'+w.id+'" aria-label="암기 표시"></button>'+
      '<div class="bd" data-edit="'+w.id+'"><div class="tm">'+esc(w.term)+
        (w.pos?'<span class="tag">'+esc(w.pos)+'</span>':'')+
        (state.day==="all"?'<span class="tag">'+esc(o.dayName)+'</span>':'')+(srsTag(w)?'<span class="tag srs">'+srsTag(w)+'</span>':'')+
      '</div>'+mean+(w.example?'<div class="ex">'+esc(w.example)+'</div>':'')+(w.ko?'<div class="ko">'+esc(w.ko)+'</div>':'')+'</div>'+
      '<button class="del" data-del="'+w.id+'" aria-label="삭제">×</button></div>';
  }).join("");
  area.innerHTML='<div class="list">'+rows+'</div>';
}

function backupText(){
  return state.days.map(function(d){
    return "["+secLabel(d.section)+" "+d.name+"]\n"+
      d.words.map(function(w){
        return w.term+" | "+(w.meaning||"")+" | "+(w.pos||"")+" | "+(w.example||"")+" | "+(w.ko||"");
      }).join("\n");
  }).join("\n\n");
}
function backupFileName(){
  var d=new Date(),p=function(n){return (n<10?"0":"")+n};
  return "toeic-vocab-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
}
function saveBackupFile(){
  try{
    var payload=JSON.stringify({app:"toeic-vocab",version:1,savedAt:new Date().toISOString(),days:state.days});
    var blob=new Blob([payload],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=backupFileName();
    document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},1000);
    toast("백업 파일을 저장했어요");
  }catch(e){ toast("저장에 실패했어요"); }
}
function applyBackup(obj){
  if(!obj||!obj.days||!obj.days.length) return {ok:false,msg:"단어가 없는 파일이에요"};
  var days=[],n=0;
  for(var i=0;i<obj.days.length;i++){
    var d=obj.days[i];
    if(!d||!d.name||!d.words||!d.words.length) continue;
    var words=[];
    for(var j=0;j<d.words.length;j++){
      var w=d.words[j];
      if(!w||!w.term) continue;
      words.push({id:w.id||uid(),term:String(w.term),meaning:w.meaning||"",pos:w.pos||"",
        example:w.example||"",ko:w.ko||"",known:!!w.known,
        stage:w.stage||0,due:w.due||0,lapses:w.lapses||0});
      n++;
    }
    if(words.length) days.push({id:d.id||uid(),name:String(d.name),section:normSec(d.section),words:words});
  }
  if(!days.length) return {ok:false,msg:"복원할 단어를 찾지 못했어요"};
  return {ok:true,days:days,count:n};
}
function restoreFromFile(file){
  var r=new FileReader();
  r.onload=function(){
    var obj=null;
    try{obj=JSON.parse(r.result)}catch(e){toast("백업 파일 형식이 아니에요");return;}
    var res=applyBackup(obj);
    if(!res.ok){toast(res.msg);return;}
    var cur=state.days.reduce(function(a,d){return a+d.words.length},0);
    if(!window.confirm("백업의 단어 "+res.count+"개로 되돌립니다.\n현재 "+cur+"개는 사라집니다. 계속할까요?")) return;
    state.days=res.days; state.day="all"; save(); render();
    toast(res.count+"개를 복원했어요");
  };
  r.onerror=function(){toast("파일을 읽지 못했어요")};
  r.readAsText(file);
}
document.getElementById("restoreInput").addEventListener("change",function(){
  if(this.files&&this.files[0]) restoreFromFile(this.files[0]);

});

      navigator.clipboard.writeText(ta.value).then(function(){toast("복사됐어요")},function(){if(!ok)toast("길게 눌러 직접 복사해주세요")});

  };
});

다."}, {"term": "advanced", "meaning": "첨단의, 상급의, 고급의", "pos": "adj.", "example": "The lab is equipped with advanced testing instruments.", "ko": "그 실험실은 첨단 검사 장비를 갖추고 있습니다."}, {"term": "advanced degree", "meaning": "상급 학위", "pos": "phrase", "example": "An advanced degree is preferred but not required.", "ko": "상급 학위가 있으면 좋지만 필수는 아닙니다."}, {"term": "advances in", "meaning": "~에서의 발전(진보)", "pos": "phrase", "example": "Recent advances in battery technology lowered production costs.", "ko": "최근 배터리 기술의 발전으로 생산 비용이 낮아졌습니다."}, {"term": "advancement to N", "meaning": "~로 승진, 진출", "pos": "phrase", "example": "Her advancement to senior manager surprised no one.", "ko": "그녀의 수석 관리자로의 승진은 누구도 놀라게 하지 않았습니다."}, {"term": "clear", "meaning": "명백한, 분명한, 확실한", "pos": "adj.", "example": "The instructions must be clear enough for new employees.", "ko": "지시 사항은 신입 직원이 이해할 만큼 명확해야 합니다."}, {"term": "special", "meaning": "특별한, 특별 상품", "pos": "adj./n.", "example": "The restaurant offers a lunch special on weekdays.", "ko": "그 식당은 평일에 점심 특선을 제공합니다."}, {"term": "specialty", "meaning": "지역 특산품, 전공 분야", "pos": "n.", "example": "Handmade ceramics are a specialty of this region.", "ko": "수제 도자기는 이 지역의 특산품입니다."}, {"term": "beside", "meaning": "~옆에", "pos": "prep.", "example": "The vending machine is beside the staff lounge.", "ko": "자판기는 직원 휴게실 옆에 있습니다."}, {"term": "besides", "meaning": "~이외에", "pos": "prep.", "example": "Besides the base salary, the position offers a yearly bonus.", "ko": "기본급 이외에, 그 직책은 연간 상여금을 제공합니다."}, {"term": "in addition to N", "meaning": "~이외에", "pos": "phrase", "example": "In addition to the warranty, buyers receive free installation.", "ko": "보증 이외에, 구매자는 무료 설치를 받습니다."}, {"term": "sole", "meaning": "유일한, 혼자의, (신발) 밑창", "pos": "adj.", "example": "The firm is the sole distributor of the brand in Asia.", "ko": "그 회사는 아시아에서 그 브랜드의 유일한 유통업체입니다."}, {"term": "superior to N", "meaning": "~보다 우수한", "pos": "phrase", "example": "The new model is superior to earlier versions in efficiency.", "ko": "새 모델은 효율성 면에서 이전 버전보다 우수합니다."}, {"term": "synthetic", "meaning": "합성의", "pos": "adj.", "example": "The jackets are made from a lightweight synthetic material.", "ko": "그 재킷은 가벼운 합성 소재로 만들어졌습니다."}, {"term": "appear + 형용사", "meaning": "~ 인 것 같다", "pos": "phrase", "example": "The figures appear accurate, but I will verify them.", "ko": "수치가 정확한 것 같지만, 제가 확인해 보겠습니다."}, {"term": "appear to do", "meaning": "~인 것 같다", "pos": "phrase", "example": "Sales appear to have stabilized in the second quarter.", "ko": "매출은 2분기에 안정된 것으로 보입니다."}, {"term": "appear as if", "meaning": "~인 것 같다", "pos": "phrase", "example": "It appears as if the shipment was misrouted.", "ko": "화물이 잘못 배송된 것 같습니다."}, {"term": "appear as though", "meaning": "~인 것 같다", "pos": "phrase", "example": "It appears as though the deadline will be extended.", "ko": "마감일이 연장될 것처럼 보입니다."}, {"term": "top priority", "meaning": "최 우선순위", "pos": "phrase", "example": "Customer safety is our top priority.", "ko": "고객 안전이 저희의 최우선순위입니다."}, {"term": "the highest priority", "meaning": "최 우선순위", "pos": "phrase", "example": "Repairs to the main line have the highest priority.", "ko": "본선 수리가 최우선순위입니다."}, {"term": "in use", "meaning": "사용 중인", "pos": "phrase", "example": "The conference room is in use until three o'clock.", "ko": "회의실은 3시까지 사용 중입니다."}, {"term": "of use", "meaning": "유용한", "pos": "phrase", "example": "The manual may be of use to new technicians.", "ko": "그 설명서는 신입 기술자들에게 유용할 것입니다."}, {"term": "of no use", "meaning": "쓸모 없는", "pos": "phrase", "example": "The outdated forms are of no use to the accounting team.", "ko": "구식 양식은 회계팀에 쓸모가 없습니다."}, {"term": "stay seated", "meaning": "계속자리에 앉아 있다", "pos": "phrase", "example": "Passengers should stay seated until the shuttle stops.", "ko": "승객들은 셔틀이 멈출 때까지 계속 앉아 계셔야 합니다."}, {"term": "in motion", "meaning": "움직이고 있는, 운전 중인", "pos": "phrase", "example": "Do not open the panel while the machinery is in motion.", "ko": "기계가 작동 중일 때는 패널을 열지 마십시오."}, {"term": "subsidiary", "meaning": "자회사", "pos": "n.", "example": "The subsidiary operates independently from the parent company.", "ko": "그 자회사는 모회사와 독립적으로 운영됩니다."}, {"term": "revisit", "meaning": "다시 논의하다 , 재방문하다", "pos": "v.", "example": "The board will revisit the proposal at the next meeting.", "ko": "이사회는 다음 회의에서 그 제안을 다시 논의할 것입니다."}, {"term": "proposed site", "meaning": "후보지", "pos": "phrase", "example": "Engineers surveyed the proposed site for the new plant.", "ko": "기술자들이 새 공장의 후보지를 조사했습니다."}, {"term": "sought-after", "meaning": "수요가 많은, 많은 사람들이 원하는", "pos": "adj.", "example": "She is a sought-after speaker at industry conferences.", "ko": "그녀는 업계 콘퍼런스에서 수요가 많은 연사입니다."}, {"term": "tech-savvy", "meaning": "최신 기술에 능한", "pos": "adj.", "example": "The campaign targets tech-savvy customers under thirty.", "ko": "그 캠페인은 30세 미만의 최신 기술에 능한 고객을 겨냥합니다."}, {"term": "setback", "meaning": "차질, 실패", "pos": "n.", "example": "A supplier shortage caused a setback in production.", "ko": "공급업체 부족으로 생산에 차질이 생겼습니다."}, {"term": "virtually", "meaning": "가상으로, 사실상, 거의", "pos": "adv.", "example": "The training can be completed virtually from any location.", "ko": "그 교육은 어디에서든 온라인으로 이수할 수 있습니다."}, {"term": "neighboring", "meaning": "인근의, 밀접한", "pos": "adj.", "example": "Deliveries were rerouted through a neighboring town.", "ko": "배송이 인근 도시를 거쳐 우회되었습니다."}, {"term": "That is", "meaning": "즉, 다시 말해", "pos": "phrase", "example": "The offer applies to full-time staff, that is, anyone working forty hours.", "ko": "그 혜택은 정규직, 즉 주 40시간 근무하는 모든 사람에게 적용됩니다."}, {"term": "put an end to N", "meaning": "~를 끝내다, 없애다", "pos": "phrase", "example": "The new policy put an end to unauthorized overtime.", "ko": "새 정책이 승인되지 않은 초과 근무를 없앴습니다."}, {"term": "feasibility", "meaning": "실행 가능성", "pos": "n.", "example": "A feasibility study will determine whether the plan is realistic.", "ko": "타당성 조사가 그 계획이 현실적인지 판단할 것입니다."}, {"term": "pick up", "meaning": "가져가다", "pos": "phrase", "example": "Please pick up your badge at t by was redesigned to feel bright and cozy.", "ko": "로비는 밝고 안락한 느낌이 나도록 재설계되었습니다."}, {"term": "thoroughly enjoy", "meaning": "매우 즐기다", "pos": "phrase", "example": "Guests thoroughly enjoyed the opening reception.", "ko": "손님들은 개막 리셉션을 매우 즐겼습니다."}, {"term": "abstract", "meaning": "추상적인, 발췌문, 초록", "pos": "adj./n.", "example": "Please submit an abstract of your presentation by Friday.", "ko": "금요일까지 발표 초록을 제출해 주세요."}, {"term": "outreach", "meaning": "봉사활동", "pos": "n.", "example": "The bank sponsors a community outreach program each spring.", "ko": "그 은행은 매년 봄 지역 봉사 프로그램을 후원합니다."}]}, {"name": "DAY 3", "words": [{"term": "resolve complaints", "meaning": "불만(사항)을 해결하다", "pos": "phrase", "example": "The service desk resolves complaints within one business day.", "ko": "서비스 데스크는 영업일 하루 안에 불만 사항을 해결합니다."}, {"term": "address complaints", "meaning": "불만(사항)을 해결하다", "pos": "phrase", "example": "Managers are trained to address complaints promptly.", "ko": "관리자들은 불만 사항을 신속히 해결하도록 교육받습니다."}, {"term": "on (such) short notice", "meaning": "갑작스러운 통보(연락)에도", "pos": "phrase", "example": "Thank you for meeting with us on such short notice.", "ko": "갑작스러운 연락에도 만나 주셔서 감사합니다."}, {"term": "preferably", "meaning": "가급적이면, 되도록이면", "pos": "adv.", "example": "Please reply by Friday, preferably before noon.", "ko": "금요일까지, 가급적이면 정오 전에 답변해 주세요."}, {"term": "mainly", "meaning": "주로, 대게", "pos": "adv.", "example": "The plant mainly produces packaging for food products.", "ko": "그 공장은 주로 식품용 포장재를 생산합니다."}, {"term": "chiefly", "meaning": "주로, 대게", "pos": "adv.", "example": "Costs rose chiefly because of higher fuel prices.", "ko": "비용 상승은 주로 유가 상승 때문이었습니다."}, {"term": "primarily", "meaning": "주로, 대게", "pos": "adv.", "example": "The grant is primarily intended for small businesses.", "ko": "그 보조금은 주로 소규모 사업체를 위한 것입니다."}, {"term": "through understanding", "meaning": "철저한 이해", "pos": "phrase", "example": "A thorough understanding of the contract is essential.", "ko": "계약에 대한 철저한 이해가 필수적입니다."}, {"term": function bankLookup(w){return BANK[String(w||"").trim().toLowerCase()]||null}
function blankInfo(sentence,term){
  if(!sentence||!term) return null;
  var clean=String(term)
    .replace(/\([^)]*\)/g," ")
    .replace(/[~+]/g," ")
    .replace(/(전치사|복수명사|형용사|기간|명사|동사|S\+V)/g," ")
    .replace(/\bN\b/g," ").replace(/\b[AB]\b/g," ")
    .replace(/[.,]/g," ").replace(/\s+/g," ").trim();
  var toks=clean.split(" ").filter(Boolean).filter(function(t){
    return !/^(a|an|the|do|doing|sth|something)$/i.test(t);
  });
  if(!toks.length) return null;
  var esc=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")};
  var unit=function(t,i){
    if(i===0&&/^be$/i.test(t)) return "(?:is|are|was|were|been|being|be)";
    if(/[^A-Za-z'’\-]/.test(t)) return esc(t);
    return esc(t)+"(?:s|es|ed|ing|d)?";
  };
  var gap="\\s+(?:(?:a|an|the|his|her|its|their|our|your|this|that|these|those)\\s+)?";
  var pat=toks.map(unit).join(gap);
  var re=new RegExp(pat,"i");
  var m=sentence.match(re);
  if(m) return {text:sentence.replace(re,"______"),answer:m[0]};
  for(var i=0;i<toks.length;i++){
    if(!/^[A-Za-z]/.test(toks[i])) continue;
    var re2=new RegExp("\\b"+esc(toks[i])+"[a-z]*\\b","i");
    var m2=sentence.match(re2);
    if(m2) return {text:sentence.replace(re2,"______"),answer:m2[0]};
  }
  return null;
}

var DKEY="toeic-vocab-dict";
var dcache={};
try{dcache=JSON.parse(localStorage.getItem(DKEY)||"{}")}catch(e){}
function dsave(){try{localStorage.setItem(DKEY,JSON.stringify(dcache))}catch(e){}}
var POS={noun:"n.",verb:"v.",adjective:"adj.",adverb:"adv.",preposition:"prep.",conjunction:"conj.",pronoun:"pron.",interjection:"int."};
function isEnglish(s){return /^[A-Za-z][A-Za-z'’\-\s]*$/.test(s.trim())}

function lookup(word){
  var k=word.trim().toLowerCase();
  if(dcache[k]!==undefined) return Promise.resolve(dcache[k]);
  return fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(k))
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){
      var out=null;
      if(j&&j[0]&&j[0].meanings&&j[0].meanings.length){
        var pos="",ex="",def="";
        for(var i=0;i<j[0].meanings.length&&!ex;i++){
          var m=j[0].meanings[i];
          for(var n=0;n<m.definitions.length;n++){
            if(m.definitions[n].example){ex=m.definitions[n].example;pos=m.partOfSpeech;def=m.definitions[n].definition;break;}
          }
        }
        if(!pos){pos=j[0].meanings[0].partOfSpeech;def=j[0].meanings[0].definitions[0].definition;}
        out={pos:POS[pos]||pos,example:ex,def:def||""};
      }
      dcache[k]=out; dsave(); return out;
    })
    .catch(function(){return null});
}
function translateText(text){
  var k="ko:"+String(text).trim().toLowerCase().slice(0,120);
  if(dcache[k]!==undefined) return Promise.resolve(dcache[k]);
  return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en|ko")
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){
      var t=(j&&j.responseData&&j.responseData.translatedText)||"";
      if(!/[가-힣]/.test(t)) t="";
      dcache[k]=t; dsave(); return t;
    })
    .catch(function(){return ""});
}
function translate(word){
  var k="ko:"+word.trim().toLowerCase();
  if(dcache[k]!==undefined) return Promise.resolve(dcache[k]);
  return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(word)+"&langpair=en|ko")
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){
      var t=(j&&j.responseData&&j.responseData.translatedText)||"";
      if(!/[가-힣]/.test(t)) t="";
      dcache[k]=t; dsave(); return t;
    })
    .catch(function(){return ""});
}

function cleanDuplicates(list){
  var cnt={},cleared=0;
  list.forEach(function(d){d.words.forEach(function(w){
    if(w.ko){ var k="k:"+w.ko; (cnt[k]=cnt[k]||[]).push(w); }
    if(w.example){ var e="e:"+w.example; (cnt[e]=cnt[e]||[]).push(w); }
  })});
  Object.keys(cnt).forEach(function(k){
    var arr=cnt[k];
    if(arr.length<2) return;
    // 서로 다른 단어에 같은 예문/해석이 붙어 있으면 잘못된 것
    var terms={},uniq=0;
    arr.forEach(function(w){ if(!terms[w.term.toLowerCase()]){terms[w.term.toLowerCase()]=1;uniq++;} });
    if(uniq<2) return;
    arr.forEach(function(w){
      var b=bankLookup(w.term);
      if(b&&b.example===w.example) return;  // 내장 데이터와 일치하면 정상
      if(k.indexOf("k:")===0) w.ko=""; else w.example="";
      cleared++;
    });
  });
  return cleared;
}
function enrichDays(list,cb){
  var wiped=cleanDuplicates(list);
  if(wiped) toast(wiped+"개의 잘못 붙은 예문·해석을 지웠어요");
  var todo=[];
  list.forEach(function(d){
    d.words.forEach(function(w){
      if(isEnglish(w.term)&&(!w.pos||!w.example||!w.meaning||!w.ko)) todo.push(w);
    });
  });
  if(!todo.length){if(cb){cb();}else{toast("채울 항목이 없어요 (이미 다 채워짐)");}return;}
  var i=0,filled=0,fails=0,tried=0;
  toast("품사·예문 채우는 중… 0/"+todo.length,true);
  (function step(){
    if(i>=todo.length){
      save(); render();
      var left=[];
      list.forEach(function(d){d.words.forEach(function(w){if(!w.example) left.push(w)})});
      if(filled) toast(filled+"개에 품사·예문이 채워졌어요");
      else if(tried&&fails===tried) toast("사전을 불러오지 못했어요. 인터넷 연결을 확인해주세요.");
      else toast("사전에서 찾은 항목이 없어요");
      if(cb){ setTimeout(cb,300); }
      else if(left.length){ setTimeout(function(){openCopySheet(left,"예문을 못 채운 단어 "+left.length+"개")},700); }
      return;
    }
    var w=todo[i++];
    toast("품사·예문 채우는 중… "+i+"/"+todo.length,true);
    var b=bankLookup(w.term);
    if(b){
      if(!w.pos) w.pos=b.pos;
      if(!w.example) w.example=b.example;
      if(!w.ko&&b.ko) w.ko=b.ko;
      if(!w.meaning) w.meaning=b.meaning;
      filled++;
      if(w.example&&!w.ko){
        translateText(w.example).then(function(t){ if(t) w.ko=t; setTimeout(step,150); });
      }else{ setTimeout(step,0); }
      return;
    }
    tried++;
    lookup(w.term).then(function(r){
      if(r){
        if(!w.pos&&r.pos) w.pos=r.pos;
        if(!w.example&&r.example) w.example=r.example;
        if(r.pos||r.example) filled++;
      }else{fails++;}
      if(w.example&&!w.ko){
        translateText(w.example).then(function(t){ if(t) w.ko=t; setTimeout(step,180); });
      }else{ setTimeout(step,180); }
    });
  })();
}

var lookupTimer=null,lookupFor="",pendingKo="";
function scheduleLookup(delay){
  clearTimeout(lookupTimer);
  var word=$("fTerm").value.trim();
  if(!word||!isEnglish(word)||word.length<2){$("lookupN").textContent="";$("lookupN").className="lookup";return;}
  if(word.toLowerCase()===lookupFor) return;
  lookupTimer=setTimeout(function(){runLookup(word)},delay===0?0:650);
}
function runLookup(word){
  lookupFor=word.toLowerCase();
  pendingKo="";
  var n=$("lookupN"); n.className="lookup"; n.textContent="찾는 중…";
  var b=bankLookup(word);
  if(b){
    var g=[];
    if(!$("fPos").value.trim()){$("fPos").value=b.pos;g.push("품사");}
    if(!$("fEx").value.trim()){$("fEx").value=b.example;pendingKo=b.ko||"";g.push("토익 예문");}
    if(!$("fMean").value.trim()){$("fMean").value=b.meaning;g.push("뜻");checkOne();}
    $("moreWrap").className=""; $("moreBtn").textContent="품사·예문 접기";
    n.className="lookup ok"; n.textContent=g.length?"토익 예문 데이터에서 자동 입력: "+g.join(", "):"토익 빈출 단어입니다";
    if(!pendingKo&&b.example){
      translateText(b.example).then(function(t){
        if($("fTerm").value.trim().toLowerCase()!==lookupFor) return;
        if(t){pendingKo=t; n.textContent="자동 입력: 뜻, 품사, 토익 예문, 해석(자동번역)";}
      });
    }
    return;
  }
  var jobs=[lookup(word), $("fMean").value.trim()?Promise.resolve(""):translate(word)];
  Promise.all(jobs).then(function(res){
    if($("fTerm").value.trim().toLowerCase()!==lookupFor) return; // 단어가 바뀌면 무시
    var r=res[0],ko=res[1],got=[];
    if(r){
      if(!$("fPos").value.trim()&&r.pos){$("fPos").value=r.pos;got.push("품사");}
      if(!$("fEx").value.trim()&&r.example){$("fEx").value=r.example;got.push("예문(사전)");}
    }
    if(ko&&!$("fMean").value.trim()){$("fMean").value=ko;got.push("뜻(자동번역)");checkOne();}
    if($("fPos").value||$("fEx").value){$("moreWrap").className="";$("moreBtn").textContent="품사·예문 접기";}
    var ex=$("fEx").value.trim();
    if(ex&&!pendingKo){
      n.className="lookup"; n.textContent="예문 해석 만드는 중…";
      translateText(ex).then(function(t){
        if($("fTerm").value.trim().toLowerCase()!==lookupFor) return;
        if(t){pendingKo=t; got.push("예문 해석(자동번역)");}
        n.className=got.length?"lookup ok":"lookup";
        n.textContent=got.length?"자동 입력: "+got.join(", ")+" · 확인 후 수정하세요":"사전에서 못 찾았어요. 직접 입력해주세요.";
      });
      return;
    }
    if(got.length){ n.className="lookup ok"; n.textContent="자동 입력: "+got.join(", "); }
    else if(r&&r.def){ n.className="lookup"; n.textContent="뜻(영영): "+r.def; }
    else { n.className="lookup"; n.textContent="사전에서 못 찾았어요. 직접 입력해주세요."; }
  });
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function launchQuiz(){
  var pool=visibleWords(); if(!pool.length) pool=scopeWords();
  var target=pool.filter(function(o){return !o.w.known});
  var deck=shuffle(target.length?target:pool);
  if(!deck.length) return;
  quiz={deck:deck,i:0,flipped:false,done:0,again:0,front:"term",missed:[],review:null};
  document.getElementById("quiz").className="quiz";
  renderQuiz();
}

function buildReview(){return buildReviewFrom(quiz.missed)}
function buildReviewFrom(missed){
  var seen={},groups={};
  missed.forEach(function(m){
    var key=m.dayId+"|"+m.w.id;
    if(seen[key]) return; seen[key]=1;
    (groups[m.dayId]=groups[m.dayId]||[]).push(m.w);
  });
  var results=[];
  Object.keys(groups).forEach(function(dayId){
    var origin=state.days.filter(function(d){return d.id===dayId})[0];
    if(!origin) return;
    if(/\+$/.test(origin.name)) return; // 이미 복습장이면 그대로 둠
    var name=origin.name+"+";
    var tgt=state.days.filter(function(d){return d.section===origin.section&&d.name===name})[0];
    if(!tgt){tgt={id:uid(),name:name,section:origin.section,words:[]};state.days.push(tgt);}
    var added=0;
    groups[dayId].forEach(function(w){
      var dup=tgt.words.some(function(x){return x.term.toLowerCase()===w.term.toLowerCase()});
      if(dup) return;
      tgt.words.push({id:uid(),term:w.term,meaning:w.meaning,pos:w.pos,example:w.example,known:false});
      added++;
    });
    if(added) results.push({name:name,added:added});
  });
  save(); render();
  return results;
}

function renderQuiz(){
  if(!quiz) return;
  var d=quiz.deck, o=d[quiz.i], fin=quiz.i>=d.length;
  document.getElementById("qCount").textContent=Math.min(quiz.i+1,d.length)+" / "+d.length;
  document.getElementById("qTally").textContent="외움 "+quiz.done+" · 다시 "+quiz.again;
  document.getElementById("qDir").textContent=quiz.front==="term"?"영 → 한":"한 → 영";
  document.getElementById("qBar").style.width=(d.length?quiz.i/d.length*100:0)+"%";
  var card=document.getElementById("qCard"), acts=document.getElementById("qActs");
  if(fin){
    if(quiz.review===null) quiz.review=reviewSummary(quiz);
    card.className="qdone";
    card.innerHTML="<b>한 바퀴 끝!</b><span>외움 "+quiz.done+"개 · 다시 본 카드 "+quiz.again+"개</span>"+
      (quiz.review.length?"<span style='color:#FFDF3D;font-weight:600'>틀린 단어 정리 → "+esc(quiz.review.join(", "))+"</span>":"");
    acts.innerHTML='<button class="got" id="qBack">단어장으로 돌아가기</button>';
    document.getElementById("qBack").onclick=closeQuiz;
    return;
  }
  var c=o.w;
  card.className="qcard";
  var front=quiz.front==="term"?c.term:(c.meaning||c.term);
  var backMain=(quiz.front==="term"?(c.meaning||"(뜻 없음)"):c.term)+(c.pos?" · "+c.pos:"");
  var hint=c.example?'<div class="qex">'+esc(blankOut(c.example,c.term))+'</div>'
                    :(quiz.flipped?'<div class="qex" style="opacity:.6">예문 없음 — 목록에서 \'예문 채우기\'를 눌러보세요</div>':"");
  card.innerHTML='<div class="qfront">'+esc(front)+'</div>'+hint+
    (quiz.flipped
      ? '<div class="qback"><div class="qmean">'+esc(backMain)+'</div>'+(c.example?'<div class="qex" style="color:#16233F">'+esc(c.example)+'</div>':'')+(c.ko?'<div class="qko">'+esc(c.ko)+'</div>':'')+'</div>'
      : '<div class="qtap">탭하면 뜻이 보여요</div>');
  acts.innerHTML='<button class="again" id="qAgain">다시</button><button class="got" id="qGot">외웠어요</button>';

// ================= 간격 반복(SRS) =================
var DAYMS=86400000;
var SRS_STEPS=[1,3,7,14,30,60];
function nowMs(){return Date.now()}
function dueDays(w){
  if(!w.due) return null;
  return Math.ceil((w.due-nowMs())/DAYMS);
}
function isDue(w){return w.due&&w.due<=nowMs()}
function allWords(){
  var out=[];
  state.days.forEach(function(d){d.words.forEach(function(w){out.push({w:w,dayId:d.id,dayName:d.name})})});
  return out;
}
function dueList(){
  return allWords().filter(function(o){return isDue(o.w)}).sort(function(a,b){return a.w.due-b.w.due});
}
function dayKey(t){
  var d=new Date(t||Date.now()),p=function(n){return (n<10?"0":"")+n};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function logStudy(ok,isNew){
  var k=dayKey();
  var e=state.log[k]||{s:0,o:0,x:0,n:0};
  e.s++; if(ok){e.o++; if(isNew) e.n++;} else e.x++;
  state.log[k]=e;
}
function grade(w,ok){
  var isNew=!w.reps;
  if(ok){
    w.reps=(w.reps||0)+1;
    w.stage=Math.min((w.stage||0)+1,SRS_STEPS.length);
    w.due=nowMs()+SRS_STEPS[w.stage-1]*DAYMS;
    w.known=true;
    if(!w.first) w.first=nowMs();
  }else{
    w.stage=0;
    w.due=nowMs()+DAYMS;
    w.known=false;
    w.lapses=(w.lapses||0)+1;
  }
  w.last=nowMs();
  logStudy(ok,isNew&&ok);
}
function srsTag(w){
  var d=dueDays(w);
  if(d===null) return "";
  if(d<=0) return "복습";
  return "D-"+d;
}

// ================= 파트5 문제 생성 =================
function capLike(src,word){
  if(!src||!word) return word;
  return /^[A-Z]/.test(src) ? word.charAt(0).toUpperCase()+word.slice(1) : word.charAt(0).toLowerCase()+word.slice(1);
}
function formVariants(ans,pos){
  var w=String(ans).trim();
  if(/\s/.test(w)||w.length<4) return [];
  var lw=w.toLowerCase(),out=[],seen={};
  function add(x){
    if(!x) return; x=x.toLowerCase();
    if(x===lw||seen[x]||x.length<3) return;
    seen[x]=1; out.push(x);
  }
  var p=String(pos||"").toLowerCase();
  var plural=/y$/.test(lw)?lw.replace(/y$/,"ies"):(/(s|x|ch|sh)$/.test(lw)?lw+"es":lw+"s");
  var ing=/ie$/.test(lw)?lw.replace(/ie$/,"ying"):(/e$/.test(lw)?lw.replace(/e$/,"ing"):lw+"ing");
  var ed=/e$/.test(lw)?lw+"d":(/y$/.test(lw)?lw.replace(/y$/,"ied"):lw+"ed");
  var ly=/le$/.test(lw)?lw.replace(/le$/,"ly"):(/y$/.test(lw)?lw.replace(/y$/,"ily"):lw+"ly");
  var isN=p.indexOf("n.")===0, isV=p.indexOf("v.")===0, isAdj=p.indexOf("adj")===0, isAdv=p.indexOf("adv")===0;
  if(isAdj){ if(!/ing$|ly$/.test(lw)) add(ly); }
  else if(isV){ add(plural); if(!/ing$/.test(lw)) add(ing); if(!/ed$/.test(lw)) add(ed); }
  else if(isN){ if(!/s$/.test(lw)) add(plural); }
  else if(isAdv){ if(/ly$/.test(lw)) add(lw.replace(/ly$/,"")); }
  else { if(!/s$|ing$|ed$|ly$/.test(lw)) add(plural); }
  return out.slice(0,2);
}
function buildQuestion(o,pool){
  var w=o.w;
  var info=blankInfo(w.example,w.term);
  if(!info||!info.answer) return null;
  var ans=info.answer;
  var opts=[ans],seen={};
  seen[ans.toLowerCase()]=1;
  formVariants(w.term,w.pos).concat(seen[w.term.toLowerCase()]?[]:[w.term]).forEach(function(v){
    var lv=String(v).toLowerCase();
    if(opts.length<3&&!seen[lv]){seen[lv]=1;opts.push(capLike(ans,v));}
  });
  var others=shuffle(pool.filter(function(p){
    if(p.w.id===w.id) return false;
    var t=p.w.term;
    if(/[^A-Za-z'’\- ]/.test(t)) return false;
    if(/\s/.test(t)!==/\s/.test(ans)) return false;
    return !seen[t.toLowerCase()];
  }));
  for(var i=0;i<others.length&&opts.length<4;i++){
    var t=others[i].w.term;
    seen[t.toLowerCase()]=1;
    opts.push(capLike(ans,t));
  }
  while(opts.length<4) opts.push(capLike(ans,"the "+opts.length));
  return {word:w,dayId:o.dayId,dayName:o.dayName,stem:info.text,answer:ans,options:shuffle(opts)};
}

// ================= 학습 시작 시트 =================
function scopeDays(){return state.day==="all"?secDays():secDays().filter(function(d){return d.id===state.day})}
function p5Pool(){
  var pool=scopeDays().length?[]:[];
  scopeDays().forEach(function(d){d.words.forEach(function(w){ if(w.example) pool.push({w:w,dayId:d.id,dayName:d.name}); })});
  return pool;
}

// ================= 파트5 =================
var p5=null;
function startP5(){
  var pool=p5Pool();
  var qs=[];
  shuffle(pool).forEach(function(o){
    if(qs.length>=20) return;
    var q=buildQuestion(o,pool);
    if(q) qs.push(q);
  });
  if(!qs.length){toast("문제를 만들 예문이 없어요");return;}
  p5={qs:qs,i:0,score:0,picked:null,missed:[],review:null};
  document.getElementById("p5").className="quiz";
  renderP5();
}
function closeP5(){
  p5=null; document.getElementById("p5").className="quiz hide"; render();
}
function renderP5(){
  if(!p5) return;
  var body=document.getElementById("pBody"),acts=document.getElementById("pActs");
  var fin=p5.i>=p5.qs.length;
  document.getElementById("pCount").textContent=Math.min(p5.i+1,p5.qs.length)+" / "+p5.qs.length;
  document.getElementById("pScore").textContent="정답 "+p5.score;
  document.getElementById("pBar").style.width=(p5.qs.length?p5.i/p5.qs.length*100:0)+"%";
  if(fin){
    if(p5.review===null) p5.review=reviewSummary(p5);
    body.innerHTML='<div style="text-align:center;padding:30px 0">'+
      '<div style="font-size:26px;font-weight:800;letter-spacing:-.02em">'+p5.score+' / '+p5.qs.length+'</div>'+
      '<div style="margin-top:8px;color:#5A6478;font-size:14px">정답률 '+Math.round(p5.score/p5.qs.length*100)+'%</div>'+
      (p5.review.length?'<div style="margin-top:12px;color:#E5BE00;font-weight:600;font-size:13.5px">틀린 단어 정리 → '+esc(p5.review.join(", "))+'</div>':'')+
      '</div>';
    acts.innerHTML='<button class="got" id="pBack">단어장으로 돌아가기</button>';
    document.getElementById("pBack").onclick=closeP5;
    return;
  }
  var q=p5.qs[p5.i];
  var letters=["A","B","C","D"];
  var opts=q.options.map(function(o,i){
    var cls="p5opt";
    if(p5.picked!==null){
      if(o===q.answer) cls+=" right";
      else if(o===p5.picked) cls+=" wrong";
    }
    return '<button class="'+cls+'" data-opt="'+esc(o)+'"><b>'+letters[i]+'</b>'+esc(o)+'</button>';
  }).join("");
  var exp="";
  if(p5.picked!==null){
    var ok=p5.picked===q.answer;
    exp='<div class="p5exp"><div class="p5verd '+(ok?"ok":"no")+'">'+(ok?"정답":"오답 · 정답은 "+esc(q.answer))+'</div>'+
      '<div class="p5line"><b>'+esc(q.word.term)+'</b>'+(q.word.pos?' · '+esc(q.word.pos):'')+' — '+esc(q.word.meaning||"")+'</div>'+
      '<div class="p5line">'+esc(q.word.example)+'</div>'+
      (q.word.ko?'<div class="p5line ko">'+esc(q.word.ko)+'</div>':'')+'</div>';
  }
  body.innerHTML='<div class="p5stem">'+esc(q.stem)+'</div><div class="p5opts">'+opts+'</div>'+exp;
  acts.innerHTML=p5.picked!==null?'<button class="got" id="pNext">'+(p5.i+1>=p5.qs.length?"결과 보기":"다음 문제")+'</button>':'';
  if(p5.picked!==null) document.getElementById("pNext").onclick=function(){p5.i++;p5.picked=null;renderP5();};
}
document.getElementById("pBody").addEventListener("click",function(e){
  var b=e.target.closest("[data-opt]"); if(!b||!p5||p5.picked!==null) return;
  var q=p5.qs[p5.i], pick=b.dataset.opt;
  p5.picked=pick;
  var ok=pick===q.answer;
  if(ok) p5.score++;
  else { var mo={w:q.word,dayId:q.dayId,dayName:q.dayName}; p5.missed.push(mo); noteReview(p5,mo); }

  save(); renderP5();
});

    });
  });
});

// ================= 학습 기록 =================
function statBar(v,max){
  var pct=max?Math.round(v/max*100):0;
  return '<span class="sbar"><i style="width:'+pct+'%"></i></span>';
}
function openStats(){
  var all=allWords();
  var total=all.length;
  var learned=all.filter(function(o){return (o.w.reps||0)>0}).length;
  var mastered=all.filter(function(o){return (o.w.stage||0)>=3}).length;
  var due=dueList().length;
  var reps=all.reduce(function(n,o){return n+(o.w.reps||0)},0);
  var lapses=all.reduce(function(n,o){return n+(o.w.lapses||0)},0);
  var tk=dayKey(), t=state.log[tk]||{s:0,o:0,x:0,n:0};

  // 최근 7일
  var rows7="",maxS=1;
  var keys=[];
  for(var i=6;i>=0;i--){ keys.push(dayKey(Date.now()-i*DAYMS)); }
  keys.forEach(function(k){ var e=state.log[k]; if(e&&e.s>maxS) maxS=e.s; });
  keys.forEach(function(k){
    var e=state.log[k]||{s:0,o:0,x:0,n:0};
    rows7+='<div class="srow"><span class="sd">'+k.slice(5).replace("-","/")+'</span>'+statBar(e.s,maxS)+
      '<span class="sv">'+e.s+'회'+(e.n?' · 새 '+e.n:'')+'</span></div>';
  });

  // DAY별
  var dayRows="";
  SECTIONS.forEach(function(s){
    var list=daySort(state.days.filter(function(d){return d.section===s.id}));
    if(!list.length) return;
    dayRows+='<div class="sgrp">'+esc(s.label)+'</div>';
    list.forEach(function(d){
      var k=d.words.filter(function(w){return w.known}).length;
      var r=d.words.reduce(function(n,w){return n+(w.reps||0)},0);
      var l=d.words.reduce(function(n,w){return n+(w.lapses||0)},0);
      dayRows+='<div class="srow"><span class="sd wide">'+esc(d.name)+'</span>'+statBar(k,d.words.length)+
        '<span class="sv">'+k+'/'+d.words.length+' · 외움 '+r+'회 · 초기화 '+l+'회</span></div>';
    });
  });

  // 자주 틀리는 단어
  var hard=all.filter(function(o){return (o.w.lapses||0)>0})
    .sort(function(a,b){return (b.w.lapses||0)-(a.w.lapses||0)}).slice(0,8);
  var hardRows=hard.length?hard.map(function(o){
    return '<div class="srow"><span class="sd wide">'+esc(o.w.term)+'</span><span class="sv">초기화 '+(o.w.lapses||0)+'회 · 외움 '+(o.w.reps||0)+'회</span></div>';
  }).join(""):'<p class="hint" style="margin:6px 0 0">아직 초기화된 단어가 없습니다.</p>';

  var sc=document.createElement("div"); sc.className="scrim";
  sc.innerHTML='<div class="sheet"><h2>학습 기록</h2>'+
    '<div class="scards">'+
      '<div class="scard"><b>'+t.s+'</b><span>오늘 학습</span></div>'+
      '<div class="scard"><b>'+learned+'</b><span>학습한 단어</span></div>'+
      '<div class="scard"><b>'+mastered+'</b><span>3단계 이상</span></div>'+
      '<div class="scard"><b>'+due+'</b><span>오늘 복습</span></div>'+
    '</div>'+
    '<p class="hint" style="margin-top:12px">전체 '+total+'개 · 누적 외움 '+reps+'회 · 누적 초기화 '+lapses+'회'+
    (t.s?' · 오늘 정답 '+t.o+' / 다시 '+t.x:'')+'</p>'+
    '<div class="sgrp">최근 7일</div>'+rows7+
    '<div class="sgrp" style="margin-top:14px">교재·DAY별</div>'+dayRows+
    '<div class="sgrp" style="margin-top:14px">자주 초기화된 단어</div>'+hardRows+
    '<div class="acts"><button class="btn ghost" id="stClose">닫기</button></div></div>';
  document.body.appendChild(sc);
  var close=function(){if(sc.parentNode)document.body.removeChild(sc)};
  sc.querySelector("#stClose").onclick=close;
  sc.onclick=function(e){if(e.target===sc)close()};
}
