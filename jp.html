<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日本語">
<meta name="theme-color" content="#FBFAF7">
<title>일본어 읽기</title>
<style>
:root{
  --paper:#FBFAF7; --sheet:#FFFFFF; --ink:#15181F; --dim:#656D7C; --faint:#8D95A4; --line:#E6E3DC;
  --accent:#C2410C; --accent-soft:#FFF1E7;
  --new:#D97706; --learn:#B45309; --fam:#0E7490; --known:#15803D;
  --new-bg:#FEF3C7; --learn-bg:#FFEDD5; --fam-bg:#E0F2FE; --ok:#15803D; --bad:#B91C1C;
  --shadow:0 10px 30px rgba(20,22,30,.10);
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Apple SD Gothic Neo","Segoe UI",sans-serif;
  padding:0 0 calc(68px + env(safe-area-inset-bottom));}
button,input,textarea,select{font-family:inherit;}
.wrap{max-width:860px;margin:0 auto;padding:0 18px;}
.pagehead{padding:calc(18px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.pagehead h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:800;}
.pagehead .sub{font-size:12.5px;color:var(--faint);margin-top:4px;}
h2{font-size:17px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em;}
.sgrp{font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:26px 0 10px;}
.hint{font-size:13px;line-height:1.75;color:var(--dim);margin:8px 0 0;}
.code{background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;}
.btn{border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 15px inherit;padding:13px 17px;min-height:50px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1px solid var(--line);}
.btn.accent{background:var(--accent);}
.btn.mini{min-height:38px;padding:8px 13px;font-size:13.5px;border-radius:10px;}
.btn:disabled{opacity:.4;}
.kbd{font-size:10px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.65;}
.link{border:0;background:transparent;color:var(--accent);font:600 13.5px inherit;cursor:pointer;padding:6px 2px;text-decoration:underline;}
.inp,.area,select.inp{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);
  font:15px inherit;padding:13px 14px;margin-top:8px;}
.area{min-height:120px;resize:vertical;line-height:1.75;}
.inp:focus,.area:focus{outline:none;border-color:var(--accent);}
.lb{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-top:16px;}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;}
/* 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(251,250,247,.94);
  backdrop-filter:saturate(1.2) blur(12px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));}
.tabbar .row{max-width:860px;margin:0 auto;display:flex;}
.tabbar button{flex:1;border:0;background:transparent;color:var(--faint);font:600 11px inherit;cursor:pointer;
  padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;}
.tabbar button .ic{font-size:19px;line-height:1;}
.tabbar button.on{color:var(--ink);}
.tabbar button{position:relative;}
.tabbar .badge{position:absolute;top:2px;left:50%;margin-left:4px;background:var(--accent);color:#fff;border-radius:9px;
  font-size:10px;font-weight:800;padding:1px 5px;min-width:17px;text-align:center;line-height:1.5;}
/* 홈 */
.hero{margin-top:6px;padding:18px;border-radius:18px;background:var(--sheet);border:1px solid var(--line);}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.hero .big small{font-size:15px;font-weight:600;color:var(--faint);margin-left:7px;letter-spacing:0;}
.hero .row{display:flex;gap:10px;margin-top:14px;}
.hero .row .btn{flex:1;}
.statrow{display:flex;gap:8px;margin-top:14px;}
.stat{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center;}
.stat b{display:block;font-size:17px;font-weight:800;}
.stat span{font-size:11px;color:var(--faint);}
.ring{width:38px;height:38px;flex:0 0 auto;}
/* 기사 카드 */
.alist{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px;}
@media (min-width:700px){.alist{grid-template-columns:1fr 1fr;}}
.acard{position:relative;display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--sheet);
  border:1px solid var(--line);border-radius:16px;padding:15px 15px;cursor:pointer;color:var(--ink);}
.acard .bd{flex:1;min-width:0;}
.acard b{display:block;font-size:15.5px;font-weight:700;line-height:1.45;margin-bottom:5px;}
.acard .meta{font-size:12px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;}
.chip.gray{background:var(--paper);color:var(--dim);border:1px solid var(--line);}
.acard .bar{height:4px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden;}
.acard .bar i{display:block;height:100%;background:var(--known);border-radius:3px;}
.amenu{position:absolute;top:10px;right:10px;border:0;background:transparent;color:var(--faint);font-size:18px;
  min-width:38px;min-height:38px;cursor:pointer;border-radius:10px;}
/* 읽기 화면 */
.reader{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;}
.reader.hide{display:none;}
.rbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  background:rgba(251,250,247,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.rbar .ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;}
.rinner{max-width:720px;margin:0 auto;padding:18px 18px 40px;}
.rprog{height:3px;background:var(--line);}
.rprog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}
.artitle{font-size:clamp(21px,3.4vw,26px);font-weight:800;line-height:1.55;letter-spacing:-.01em;
  word-break:normal;overflow-wrap:break-word;line-break:strict;}
.artitleko{font-size:14px;color:var(--dim);margin-top:7px;line-height:1.6;}
.armeta{font-size:12.5px;color:var(--faint);margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.armeta a{color:var(--accent);}
.jpara{margin:30px 0;}
.jsent{display:block;font-size:calc(18px * var(--fs));line-height:2.2;margin:0 -6px 2px;padding:2px 6px;
  border-radius:8px;word-break:normal;overflow-wrap:break-word;line-break:strict;cursor:pointer;}
.jsent.cur{background:var(--accent-soft);}
.koS{display:block;font-size:calc(14px * var(--fs));line-height:1.75;color:var(--dim);margin:4px 0 12px;padding:8px 11px;
  background:var(--sheet);border:1px solid var(--line);border-radius:10px;}
.koS.hide{display:none;}
ruby{ruby-align:center;}
.jsent rt{font-size:.44em;color:var(--faint);font-weight:600;letter-spacing:-.06em;line-height:1.1;}
.artitle rt{font-size:.4em;color:var(--faint);font-weight:600;letter-spacing:-.06em;}
.suggest{background:var(--fam-bg);border:1px solid var(--fam);border-radius:12px;padding:11px 13px;margin-top:10px;
  font-size:13.5px;line-height:1.7;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.suggest b{font-weight:800;}
.jacover{display:block;color:var(--dim);font-size:calc(15px * var(--fs));line-height:1.8;}
.jacover b{color:var(--accent);font-size:12.5px;font-weight:700;}
.jacover.hide,.jareal.hide{display:none;}
.kobtn.sp{background:var(--fam-bg);color:var(--fam);}
.kobtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;opacity:.75;
  font:700 10px/1 inherit;padding:4px 5px;margin:0 4px;vertical-align:3px;cursor:pointer;min-width:22px;}
.kobtn:active{background:var(--accent-soft);color:var(--accent);}
.jsent.cur .kobtn{border-color:var(--accent);color:var(--accent);}
.w{cursor:pointer;border-radius:3px;padding:0 1px;}
.w.s0{box-shadow:inset 0 -2.5px 0 var(--new);background:linear-gradient(transparent 82%,var(--new-bg) 82%);}
.w.s1{box-shadow:inset 0 -2.5px 0 var(--learn);}
.w.s2{box-shadow:inset 0 -1.5px 0 var(--fam);}
.w.s3{box-shadow:none;}
.w.s3:active,.w.s2:active{background:var(--accent-soft);}
.w.sel{outline:2px solid var(--accent);outline-offset:1px;}
.tok{cursor:pointer;border-radius:3px;}
.tok:active{background:var(--new-bg);}
.finish{margin:26px 0 6px;padding:18px;border-radius:16px;background:var(--sheet);border:1px solid var(--line);text-align:center;}
.finish .fh{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.finish .fs{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.7;}
.finish .frow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.gnote{margin:10px 0 0;background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.75;}
.gnote b{font-weight:800;}
.gnote .ex{display:block;color:var(--dim);margin-top:4px;font-size:13px;}
.pdone{display:flex;align-items:center;gap:7px;margin-top:12px;opacity:.85;}
.pdone button{border:1px solid var(--line);background:transparent;color:var(--faint);border-radius:999px;
  font:600 11.5px inherit;padding:6px 11px;min-height:32px;cursor:pointer;}
.pdone button.on{background:var(--known);border-color:var(--known);color:#fff;}
.gtoggle{border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:999px;
  font:700 11.5px inherit;padding:6px 11px;min-height:32px;cursor:pointer;}
.gwrap.hide{display:none;}
.myko{margin-top:6px;}
/* 단어 패널 */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--sheet);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom));
  max-height:70vh;overflow:auto;transform:translateY(0);transition:transform .18s ease;}
.panel.hide{transform:translateY(110%);}
.panel .inner{max-width:720px;margin:0 auto;}
.pw{display:flex;align-items:flex-start;gap:12px;}
.pw .lead{flex:1;min-width:0;}
.pw .term{font-size:27px;font-weight:800;line-height:1.25;}
.pw .read{font-size:14.5px;color:var(--dim);margin-top:4px;}
.pw .mean{font-size:17px;margin-top:9px;line-height:1.55;}
.pw .hanja{display:inline-block;margin-top:9px;background:var(--fam-bg);color:var(--fam);border-radius:7px;
  padding:3px 9px;font-size:13px;font-weight:800;}
.pw .note{font-size:13px;color:var(--dim);margin-top:9px;line-height:1.7;}
.px{border:0;background:transparent;color:var(--faint);font-size:24px;min-width:42px;min-height:42px;cursor:pointer;}
.statusrow{display:flex;gap:6px;margin-top:14px;}
.statusrow button{flex:1;border:1px solid var(--line);background:var(--sheet);border-radius:11px;font:700 12.5px inherit;
  padding:10px 4px;min-height:44px;cursor:pointer;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;}
.statusrow button .k{font-size:9.5px;font-weight:700;opacity:.6;}
.statusrow button.on[data-st="0"]{background:var(--new-bg);border-color:var(--new);color:var(--new);}
.statusrow button.on[data-st="1"]{background:var(--learn-bg);border-color:var(--learn);color:var(--learn);}
.statusrow button.on[data-st="2"]{background:var(--fam-bg);border-color:var(--fam);color:var(--fam);}
.statusrow button.on[data-st="3"]{background:#DCFCE7;border-color:var(--known);color:var(--known);}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:14px;}
@media (max-width:520px){
  .kgrid{grid-template-columns:1fr 1fr;gap:7px;}
  .kcard{padding:9px 10px;}
  .kcard .ch{font-size:23px;}
  .kcard .mn,.kcard .kr{font-size:11.5px;}
  .kcard .rd{font-size:11px;}
  .panel{max-height:76vh;}
}
.kcard{border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:var(--paper);}
.kcard .ch{font-size:28px;font-weight:700;line-height:1.05;}
.kcard .kr{font-size:12.5px;color:var(--fam);font-weight:800;margin-top:3px;}
.kcard .mn{font-size:12.5px;margin-top:5px;line-height:1.5;}
.kcard .rd{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.6;}
.kcard .rd b{color:var(--ink);font-weight:700;margin-right:3px;}
.panel .wlist{grid-template-columns:1fr;}
.occ{margin-top:14px;}
.occ .item{font-size:13.5px;line-height:1.9;padding:9px 11px;background:var(--paper);border:1px solid var(--line);
  border-radius:11px;margin-top:7px;}
.occ .item em{font-style:normal;background:var(--new-bg);border-radius:3px;padding:0 2px;}
.occ .item span{display:block;font-size:12.5px;color:var(--faint);margin-top:3px;}
/* 복습 */
.revwrap{position:fixed;inset:0;z-index:75;background:var(--paper);display:flex;flex-direction:column;}
.revwrap.hide{display:none;}
.revbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;}
.revbar .prog{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
.revbar .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
.revbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px;}
.qcard{width:100%;max-width:560px;background:var(--sheet);border:1px solid var(--line);border-radius:22px;
  padding:34px 24px;text-align:center;box-shadow:var(--shadow);min-height:260px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.qtype{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;}
.qmain{font-size:36px;font-weight:800;line-height:1.35;word-break:normal;overflow-wrap:break-word;}
.qmain.small{font-size:23px;font-weight:700;line-height:1.85;}
.qsub{font-size:15px;color:var(--dim);line-height:1.7;}
.qans{font-size:21px;font-weight:700;}
.qmeta{font-size:13px;color:var(--dim);line-height:1.8;}
.qex{margin-top:12px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  font-size:14px;line-height:1.9;text-align:left;}
.qex span{display:block;color:var(--faint);font-size:12.5px;margin-top:3px;}
.qcloze{display:inline-block;min-width:68px;border-bottom:2.5px solid var(--accent);margin:0 3px;}
.qcloze.on{border-bottom-color:transparent;background:var(--accent-soft);border-radius:5px;padding:0 5px;color:var(--accent);}
.revacts{width:100%;max-width:560px;display:flex;gap:9px;margin-top:20px;}
.revacts button{flex:1;border:0;border-radius:14px;padding:16px 8px;font:700 14.5px inherit;cursor:pointer;min-height:58px;
  display:flex;flex-direction:column;align-items:center;gap:3px;}
.revacts button small{font-size:10.5px;font-weight:600;opacity:.75;}
.b-again{background:#FEE2E2;color:var(--bad);}
.b-hard{background:#FEF3C7;color:#92400E;}
.b-good{background:#DCFCE7;color:var(--ok);}
.b-easy{background:#E0F2FE;color:var(--fam);}
.b-show{background:var(--ink);color:#fff;}
.revdone{text-align:center;}
.revdone .big{font-size:44px;font-weight:800;letter-spacing:-.02em;}
/* 단어 탭 */
.filters{display:flex;gap:7px;overflow-x:auto;padding:4px 0 2px;margin:0 -2px;}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--sheet);color:var(--dim);border-radius:999px;
  font:600 12.5px inherit;padding:8px 13px;min-height:38px;cursor:pointer;}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.wlist{margin-top:12px;display:grid;grid-template-columns:1fr;gap:8px;}
@media (min-width:700px){.wlist{grid-template-columns:1fr 1fr;}}
.wrow{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;}
.wrow .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;}
.wrow .bd{flex:1;min-width:0;}
.wrow .t{font-size:17px;font-weight:700;}
.wrow .r{font-size:12.5px;color:var(--faint);margin-top:2px;}
.wrow .m{font-size:13.5px;color:var(--dim);margin-top:3px;}
.wrow .due{font-size:11px;color:var(--faint);text-align:right;flex:0 0 auto;}
.dot.s0{background:var(--new);} .dot.s1{background:var(--learn);} .dot.s2{background:var(--fam);} .dot.s3{background:var(--known);}
/* 기록 */
.heat{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px;}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--line);}
.heat i.l1{background:#FDE68A;} .heat i.l2{background:#FCD34D;} .heat i.l3{background:#F59E0B;} .heat i.l4{background:#B45309;}
.barchart{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:14px;}
.barchart .b{flex:1;background:var(--accent-soft);border-radius:5px 5px 0 0;position:relative;min-height:3px;}
.barchart .b i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:5px 5px 0 0;display:block;}
.barlabels{display:flex;gap:5px;margin-top:5px;}
.barlabels span{flex:1;text-align:center;font-size:9.5px;color:var(--faint);}
.prog2{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:12px;border:1px solid var(--line);}
.prog2 i{display:block;height:100%;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim);}
.legend span{display:flex;align-items:center;gap:5px;}
.legend em{width:9px;height:9px;border-radius:50%;font-style:normal;}
/* 시트 */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(15,18,25,.45);display:flex;align-items:flex-end;justify-content:center;}
.scrim.hide{display:none;}
.sheet{width:100%;max-width:860px;background:var(--paper);border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;}
.sheet h2{margin-bottom:6px;}
.acts{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));
  background:var(--paper);padding-top:12px;}
.acts .btn{flex:1;}
.mode{width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:15px;
  margin-top:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;color:var(--ink);}
.mode b{font-size:15px;font-weight:700;}
.mode span{font-size:12.5px;color:var(--dim);line-height:1.5;}
.seg{display:flex;gap:6px;margin-top:10px;}
.seg button{flex:1;border:1px solid var(--line);background:var(--sheet);color:var(--dim);border-radius:11px;
  font:600 13px inherit;padding:11px 6px;min-height:44px;cursor:pointer;}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top));z-index:95;
  background:var(--ink);color:#fff;border-radius:12px;padding:11px 17px;font-size:13.5px;display:none;max-width:88vw;
  text-align:center;pointer-events:none;box-shadow:var(--shadow);}
.empty{text-align:center;padding:48px 18px;color:var(--faint);}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:7px;}
.empty small{font-size:13px;line-height:1.8;display:block;}
.errbox{background:#FEE2E2;border:1px solid var(--bad);color:#7F1D1D;border-radius:12px;padding:12px 14px;
  font-size:12.5px;margin:12px 0;line-height:1.65;}

<body>
<div class="wrap" id="app"></div>

<div class="tabbar"><div class="row">
  <button data-tab="home" class="on"><span class="ic">📖</span>읽기</button>
  <button data-tab="review"><span class="ic">🔁</span><span id="revBadge"></span>복습</button>
  <button data-tab="words"><span class="ic">🗂</span>단어</button>
  <button data-tab="stats"><span class="ic">📊</span>기록</button>
</div></div>

<div class="reader hide" id="reader">
  <div class="rbar">
    <button class="btn ghost mini" id="rBack">← <span class="kbd">Esc</span></button>
    <div class="ttl" id="rTitle"></div>
    <button class="btn ghost mini" id="rWords">단어</button>
    <button class="btn ghost mini" id="rSet">표시</button>
  </div>
  <div class="rprog"><i id="rProg"></i></div>
  <div class="rbody" id="rBody"></div>
</div>

<div class="panel hide" id="panel"></div>

<div class="revwrap hide" id="revWrap">
  <div class="revbar">
    <button class="btn ghost mini" id="revClose">닫기 <span class="kbd">Esc</span></button>
    <div class="prog"><i id="revProg"></i></div>
    <button class="btn ghost mini hide" id="revUndo">되돌리기</button>
    <div style="font-size:12.5px;color:var(--faint)" id="revCount"></div>
  </div>
  <div class="revbody" id="revBody"></div>
</div>

<div class="scrim hide" id="scrim"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
var APP_VER="j3";
var KEY="jp2";
var state={v:2,arts:[],bank:{},log:{},gram:{},ui:{furi:"new",ko:"hide",fs:1,tab:"home",tts:true,rate:0.95,jaHide:false},streak:{last:"",n:0}};
var toastEl=null,toastTimer=null,saveTimer=null;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function todayKey(t){var d=new Date(t||Date.now());return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function dayAdd(k,n){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return todayKey(d.getTime());}
var DAY=86400000;
function toast(msg,sticky){
  if(!toastEl){toastEl=document.createElement("div");toastEl.className="toast";document.body.appendChild(toastEl);}
  toastEl.textContent=msg;toastEl.style.display="block";
  clearTimeout(toastTimer);
  if(!sticky)toastTimer=setTimeout(function(){toastEl.style.display="none";},2400);
}
function showErr(msg){
  var a=$("app");if(!a)return;
  var d=document.createElement("div");d.className="errbox";
  d.innerHTML="<b>문제가 생겼어요</b><br>"+esc(msg)+"<br>화면을 닫았다 열어보세요. 저장된 내용은 그대로입니다.";
  a.insertBefore(d,a.firstChild);
}
window.addEventListener("error",function(e){showErr((e&&e.message)||"알 수 없는 오류");});

/* ---------- 저장 ---------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return;
    var o=JSON.parse(raw);if(!o)return;
    if(Array.isArray(o.arts))state.arts=o.arts;
    if(o.bank&&typeof o.bank==="object")state.bank=o.bank;
    if(o.log&&typeof o.log==="object")state.log=o.log;
    if(o.gram&&typeof o.gram==="object")state.gram=o.gram;
    if(o.streak)state.streak=o.streak;
    if(o.ui){for(var k in o.ui)if(o.ui.hasOwnProperty(k))state.ui[k]=o.ui[k];}
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({v:2,arts:state.arts,bank:state.bank,log:state.log,gram:state.gram,ui:state.ui,streak:state.streak}));
    syncSoon();
  }catch(e){showErr("저장 공간이 가득 찼을 수 있어요. 더보기 → 백업으로 내보낸 뒤 오래된 기사를 지워주세요.");}
}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,400);}
function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;save();}}

/* ---------- 기록 ---------- */
function bump(kind,n){
  var k=todayKey();
  var r=state.log[k]||(state.log[k]={nw:0,rev:0,sent:0,min:0});
  r[kind]=(r[kind]||0)+(n||1);
  if(state.streak.last!==k){
    var y=dayAdd(k,-1);
    state.streak.n=(state.streak.last===y)?(state.streak.n||0)+1:1;
    state.streak.last=k;
  }
  saveSoon();
}

/* ---------- 소리내어 읽기 ---------- */
var TTS=(function(){try{return !!window.speechSynthesis&&!!window.SpeechSynthesisUtterance;}catch(e){return false;}})();
var jaVoice=null;
function pickVoice(){
  if(!TTS)return null;
  try{
    var vs=speechSynthesis.getVoices()||[];
    for(var i=0;i<vs.length;i++)if((vs[i].lang||"").toLowerCase().indexOf("ja")===0)return vs[i];
  }catch(e){}
  return null;
}
if(TTS){
  try{speechSynthesis.onvoiceschanged=function(){jaVoice=pickVoice();};}catch(e){}
  setTimeout(function(){jaVoice=pickVoice();},300);
}
function speakPara(a,pi){
  if(!TTS||state.ui.tts===false)return;
  var sents=a.paras[pi]||[];
  try{
    speechSynthesis.cancel();
    sents.forEach(function(s){
      var u=new SpeechSynthesisUtterance(s.ja);
      u.lang="ja-JP";
      if(!jaVoice)jaVoice=pickVoice();
      if(jaVoice)u.voice=jaVoice;
      u.rate=state.ui.rate||0.95;
      speechSynthesis.speak(u);
    });
    toast("문단을 읽어줍니다 · 멈추려면 다시 탭");
  }catch(e){}
}
function speak(text){
  if(!TTS||state.ui.tts===false)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text));
    u.lang="ja-JP";
    if(!jaVoice)jaVoice=pickVoice();
    if(jaVoice)u.voice=jaVoice;
    u.rate=state.ui.rate||0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* ---------- 글자 ---------- */
var RE_KANJI=/[一-鿿々〇]/;
function cls(ch){
  if(RE_KANJI.test(ch))return "k";
  if(/[぀-ゟ]/.test(ch))return "h";
  if(/[゠-ヿー]/.test(ch))return "c";
  if(/[A-Za-z0-9０-９Ａ-Ｚａ-ｚ%％]/.test(ch))return "a";
  return "x";
}
function hasKanji(s){return RE_KANJI.test(String(s));}

/* ---------- 단어장 ---------- */
function wkey(w,r){return String(w)+"|"+String(r||"");}
function bankList(){
  var out=[];for(var k in state.bank)if(state.bank.hasOwnProperty(k))out.push(state.bank[k]);
  return out;
}
function bankGet(k){return state.bank[k]||null;}
function statusName(st){return ["새 단어","학습 중","익숙","외움","안 봄"][st]||"새 단어";}
function addWord(o){
  var k=wkey(o.w,o.r);
  var b=state.bank[k];
  if(!b){
    b=state.bank[k]={key:k,w:o.w,r:o.r||"",ko:o.ko||"",hanja:o.hanja||"",pos:o.pos||"",jlpt:o.jlpt||"",
      note:o.note||"",kanji:o.kanji||[],forms:o.forms||[],st:0,stage:0,due:0,reps:0,lapses:0,last:0,
      added:Date.now(),occ:[]};
  }else{
    if(o.ko&&!b.ko)b.ko=o.ko;
    if(o.r&&!b.r)b.r=o.r;
    if(o.hanja&&!b.hanja)b.hanja=o.hanja;
    if(o.pos&&!b.pos)b.pos=o.pos;
    if(o.jlpt&&!b.jlpt)b.jlpt=o.jlpt;
    if(o.note&&!b.note)b.note=o.note;
    if(o.kanji&&o.kanji.length&&!(b.kanji||[]).length)b.kanji=o.kanji;
    if(o.forms&&o.forms.length){
      b.forms=b.forms||[];
      o.forms.forEach(function(f){if(b.forms.indexOf(f)<0)b.forms.push(f);});
    }
  }
  return b;
}
function addOcc(b,artId,pi,si){
  b.occ=b.occ||[];
  for(var i=0;i<b.occ.length;i++){var o=b.occ[i];if(o.a===artId&&o.p===pi&&o.s===si)return;}
  b.occ.push({a:artId,p:pi,s:si});
  if(b.occ.length>40)b.occ.shift();
}
/* 본문에서 찾을 표면형 (기본형 + 활용형) */
function surfaces(b){
  var out=[b.w];
  (b.forms||[]).forEach(function(f){if(f&&out.indexOf(f)<0)out.push(f);});
  return out;
}
var matchIdx=null;
function buildIndex(){
  matchIdx={};
  bankList().forEach(function(b){
    if(b.st===4)return;
    surfaces(b).forEach(function(s){
      if(!s)return;
      var c=s.charAt(0);
      (matchIdx[c]=matchIdx[c]||[]).push({s:s,b:b});
    });
  });
  for(var c in matchIdx)if(matchIdx.hasOwnProperty(c))
    matchIdx[c].sort(function(x,y){return y.s.length-x.s.length;});
}
function matchAt(text,i){
  if(!matchIdx)buildIndex();
  var cand=matchIdx[text.charAt(i)];
  if(!cand)return null;
  for(var j=0;j<cand.length;j++){
    if(text.substr(i,cand[j].s.length)===cand[j].s)return cand[j];
  }
  return null;
}

/* ---------- 복습 일정 ---------- */
var STEPS=[1,3,7,16,35,80,180];
function stFromStage(g){return g<=1?1:(g===2?2:3);}   // 0~1 학습 중 · 2 익숙 · 3 이상(16일 간격~) 외움
function schedule(b,grade){
  /* grade: 0 다시, 1 어려움, 2 좋음, 3 쉬움 */
  var now=Date.now();
  b.reps=(b.reps||0)+1;b.last=now;
  if(grade===0){
    b.lapses=(b.lapses||0)+1;
    b.stage=Math.max(0,(b.stage||0)-1);
    b.due=now+10*60000;
    b.st=1;
    return;
  }
  var g=b.stage||0;
  if(grade===1)g=Math.max(0,g);
  else if(grade===2)g=g+1;
  else g=g+2;
  b.stage=Math.min(g,STEPS.length-1);
  var days=STEPS[b.stage];
  if(grade===1)days=Math.max(1,Math.round(days*0.6));
  b.due=now+days*DAY;
  b.st=stFromStage(b.stage);
}
function dueList(){
  var now=Date.now();
  return bankList().filter(function(b){
    if(b.st===4||b.st===3&&b.stage>=STEPS.length-1&&b.due>now)return false;
    return b.due&&b.due<=now;
  });
}
function newList(){
  return bankList().filter(function(b){return b.st===0;});
}
function dueCount(){return dueList().length+dueGram().length;}
function dueGram(){
  var now=Date.now(),out=[];
  for(var k in state.gram)if(state.gram.hasOwnProperty(k)){
    var g=state.gram[k];
    if(g.due&&g.due<=now)out.push(g);
  }
  return out;
}

/* ================= 기사 넣기 ================= */
function splitParasRaw(t){
  return String(t).replace(/\r/g,"").split(/\n\s*\n/).map(function(s){return s.trim();}).filter(Boolean);
}
/* 일본어 문장 나누기 (。！？ 뒤, 괄호 안은 유지) */
function splitSents(t){
  var out=[],cur="",depth=0;
  for(var i=0;i<t.length;i++){
    var ch=t.charAt(i);cur+=ch;
    if("「『（(".indexOf(ch)>-1)depth++;
    else if("」』）)".indexOf(ch)>-1)depth=Math.max(0,depth-1);
    else if("。！？!?".indexOf(ch)>-1&&depth===0){
      var nx=t.charAt(i+1);
      if(nx&&"」』）)".indexOf(nx)>-1){cur+=nx;i++;}
      out.push(cur.trim());cur="";
    }
  }
  if(cur.trim())out.push(cur.trim());
  return out.length?out:[t];
}
function newArticle(o){
  return {id:uid(),title:o.title||"",titleKo:o.titleKo||"",source:o.source||"",date:o.date||"",url:o.url||"",
    topic:o.topic||"",level:o.level||"",paras:o.paras||[],gram:o.gram||[],myko:{},note:"",done:{},at:Date.now(),open:0};
}
/* 분석 파일(JSON) */
function importJson(text,quiet){
  var o=null;
  try{o=JSON.parse(text);}catch(e){if(!quiet)toast("파일 형식이 아니에요. 내용을 전부 복사했는지 확인해주세요");return null;}
  if(!o||!Array.isArray(o.paras)||!o.paras.length){if(!quiet)toast("본문이 없는 파일이에요");return null;}
  var paras=o.paras.map(function(p){
    if(typeof p==="string")return splitSents(p).map(function(s){return {ja:s,ko:""};});
    if(Array.isArray(p))return p.map(function(s){return typeof s==="string"?{ja:s,ko:""}:{ja:String(s.ja||""),ko:String(s.ko||""),n:String(s.n||"")};}).filter(function(s){return s.ja;});
    if(p&&Array.isArray(p.s))return p.s.map(function(s){return typeof s==="string"?{ja:s,ko:""}:{ja:String(s.ja||""),ko:String(s.ko||""),n:String(s.n||"")};}).filter(function(s){return s.ja;});
    if(p&&p.ja){
      var ss=splitSents(String(p.ja));
      if(ss.length===1)return [{ja:ss[0],ko:String(p.ko||"")}];
      return ss.map(function(s,i){return {ja:s,ko:i===0?String(p.ko||""):""};});
    }
    return null;
  }).filter(function(x){return x&&x.length;});
  if(!paras.length){if(!quiet)toast("본문이 없는 파일이에요");return null;}
  var gram=(Array.isArray(o.grammar)?o.grammar:[]).map(function(g){
    return {p:String(g.p||g.pattern||""),ko:String(g.ko||""),ex:String(g.ex||""),exKo:String(g.exKo||""),
      para:(typeof g.para==="number")?g.para:-1};
  }).filter(function(g){return g.p;});
  var a=newArticle({title:String(o.title||"").trim()||"제목 없음",titleKo:String(o.titleKo||""),
    source:String(o.source||""),date:String(o.date||""),url:String(o.url||""),topic:String(o.topic||""),
    level:String(o.level||""),paras:paras,gram:gram});
  var same=null;
  for(var i=0;i<state.arts.length;i++)if(state.arts[i].title&&state.arts[i].title===a.title)same=state.arts[i];
  if(same){
    if(!window.confirm("같은 제목의 기사가 이미 있어요.\n새 내용으로 바꿀까요? (단어장은 그대로 유지됩니다)"))return null;
    state.arts=state.arts.filter(function(x){return x!==same;});
  }
  state.arts.push(a);
  /* 단어를 단어장에 합치고, 이 기사 문장과 연결한다 */
  var added=0,merged=0;
  (Array.isArray(o.words)?o.words:[]).forEach(function(w){
    if(!w||!w.w)return;
    var before=!!state.bank[wkey(w.w,w.r||"")];
    var b=addWord({w:String(w.w),r:String(w.r||""),ko:String(w.ko||""),hanja:String(w.hanja||""),
      pos:String(w.pos||""),jlpt:String(w.jlpt||""),note:String(w.note||""),
      forms:(Array.isArray(w.forms)?w.forms:[]).map(String),
      kanji:(Array.isArray(w.kanji)?w.kanji:[]).map(function(k){
        return {c:String(k.c||""),kr:String(k.kr||""),mean:String(k.mean||""),
          on:[].concat(k.on||[]).map(String),kun:[].concat(k.kun||[]).map(String)};})});
    if(before)merged++;else added++;
  });
  (gram||[]).forEach(function(g){
    if(!state.gram[g.p])state.gram[g.p]={p:g.p,ko:g.ko,ex:g.ex,exKo:g.exKo,st:0,stage:0,due:0,reps:0,lapses:0,arts:[]};
    var gg=state.gram[g.p];
    if(gg.arts.indexOf(a.id)<0)gg.arts.push(a.id);
    if(!gg.ko&&g.ko)gg.ko=g.ko;
    if(!gg.ex&&g.ex)gg.ex=g.ex;
  });
  buildIndex();
  linkArticle(a);
  save();
  if(!quiet)toast("문단 "+paras.length+"개 · 새 단어 "+added+"개"+(merged?(" · 이미 있던 단어 "+merged+"개"):""));
  return a;
}
/* 본문에서 단어가 나온 문장을 기록해 둔다 (예문·빈칸 문제에 쓰임) */
function linkArticle(a){
  if(!a||!a.paras)return;
  if(!matchIdx)buildIndex();
  a.paras.forEach(function(sents,pi){
    sents.forEach(function(s,si){
      var t=s.ja,i=0;
      while(i<t.length){
        var m=matchAt(t,i);
        if(m){addOcc(m.b,a.id,pi,si);i+=m.s.length;}
        else i++;
      }
    });
  });
}
/* 한 편이든 여러 편이든 받아들인다 */
function importAny(text){
  var o=null;
  try{o=JSON.parse(text);}catch(e){toast("파일 형식이 아니에요");return null;}
  var list=null;
  if(Array.isArray(o))list=o;
  else if(Array.isArray(o.articles))list=o.articles;
  if(list){
    var made=0,first=null;
    for(var i=0;i<list.length;i++){
      var a=importJson(JSON.stringify(list[i]),true);
      if(a){made++;if(!first)first=a;}
    }
    if(!made){toast("넣을 기사를 찾지 못했어요");return null;}
    toast("기사 "+made+"편을 넣었어요");
    closeSheet();
    if(first)openArticle(first.id);
    return first;
  }
  var one=importJson(text);
  if(one){closeSheet();openArticle(one.id);}
  return one;
}
/* 원문만 붙여넣기 */
function importRaw(text,meta){
  var ps=splitParasRaw(text);
  if(!ps.length){toast("본문을 찾지 못했어요");return null;}
  var a=newArticle({title:(meta.title||"").trim()||ps[0].slice(0,24),source:(meta.source||"").trim(),
    date:(meta.date||"").trim(),topic:(meta.topic||"").trim(),
    paras:ps.map(function(p){return splitSents(p).map(function(s){return {ja:s,ko:""};});})});
  state.arts.push(a);buildIndex();linkArticle(a);save();
  toast("문단 "+a.paras.length+"개를 넣었어요");
  return a;
}
function artSentCount(a){var n=0;a.paras.forEach(function(p){n+=p.length;});return n;}
function artWordRefs(a){
  var out=[],seen={};
  bankList().forEach(function(b){

function furiWrap(word,b){
  if(state.ui.furi==="off")return esc(word);
  if(!b||!b.r||!hasKanji(word))return esc(word);
  if(state.ui.furi==="new"&&b.st>=2)return esc(word);
  var r=b.r;
  if(word!==b.w&&b.r){
    /* 활용형이면 공통 어미를 빼고 읽기를 맞춘다 */
    var tail=0;
    while(tail<word.length&&tail<b.w.length&&word.charAt(word.length-1-tail)===b.w.charAt(b.w.length-1-tail))tail++;
    if(tail>0&&r.length>tail)r=r.slice(0,r.length-tail);
    var head=word.slice(0,word.length-tail),rest=word.slice(word.length-tail);
    if(!hasKanji(head))return esc(word);
    return "<ruby>"+esc(head)+"<rt>"+esc(r)+"</rt></ruby>"+esc(rest);
  }
  return "<ruby>"+esc(word)+"<rt>"+esc(r)+"</rt></ruby>";
}
function sentHtml(t){
  var out="",i=0;
  while(i<t.length){
    var m=matchAt(t,i);
    if(m){
      out+='<span class="w s'+(m.b.st===4?3:m.b.st)+'" data-k="'+esc(m.b.key)+'">'+furiWrap(m.s,m.b)+"</span>";
      i+=m.s.length;continue;
    }
    var c=cls(t.charAt(i)),run=t.charAt(i),j=i+1;
    while(j<t.length&&cls(t.charAt(j))===c&&!matchAt(t,j)){run+=t.charAt(j);j++;}
    if(c==="k"||c==="c"||c==="a")out+='<span class="tok" data-t="'+esc(run)+'">'+esc(run)+"</span>";
    else out+=esc(run);
    i=j;
  }
  return out;
}

/* 패널이 가리는 자리에 있으면 본문을 조금 올린다 */
function keepVisible(el){
  var panel=$("panel"); if(!panel||panel.className.indexOf("hide")>-1)return;
  var box=$("rBody"),top=panel.getBoundingClientRect().top;
  var r=el.getBoundingClientRect();
  if(r.bottom>top-14){
    box.scrollTop+=(r.bottom-(top-14))+40;
  }else if(r.top<box.getBoundingClientRect().top+10){
    box.scrollTop-=((box.getBoundingClientRect().top+10)-r.top)+20;
  }
}

/* 단어 직접 담기 / 고치기 */
/* 탭한 덩어리가 이미 담은 단어의 활용형인지 찾아본다 (記録される → 記録) */
function formOwner(token){
  if(!token||token.length<2)return null;
  var best=null;
  bankList().forEach(function(b){
    if(b.st===4)return;
    if(b.w===token)return;
    if(b.w.length>=2&&token.indexOf(b.w)===0&&token.length-b.w.length<=4){
      if(!best||b.w.length>best.w.length)best=b;
    }
  });
  return best;
}
/* 다른 단어에 이미 적어둔 한자 풀이를 가져온다 */
function knownKanji(ch){
  var all=bankList();
  for(var i=0;i<all.length;i++){
    var ks=all[i].kanji||[];
    for(var j=0;j<ks.length;j++)if(ks[j].c===ch&&(ks[j].mean||ks[j].kr))return ks[j];
  }
  return null;
}
function autoKanjiRows(term){
  var out=[],seen={};
  for(var i=0;i<term.length;i++){
    var ch=term.charAt(i);
    if(!RE_KANJI.test(ch)||seen[ch])continue;
    seen[ch]=1;
    var k=knownKanji(ch);
    if(k)out.push(k.c+" | "+(k.kr||"")+" | "+(k.mean||"")+" | "+((k.on||[]).join(","))+" | "+((k.kun||[]).join(",")));
    else out.push(ch+" |  |  |  | ");
  }
  return out.join("\n");
}
function openNewWord(token,edit){
  var b=edit||null;

  var kan=((b&&b.kanji)||[]).map(function(k){

      '<button class="btn mini" data-s="form">이 형태를 '+esc(owner.w)+'에 붙이기</button></div>':'')+
    '<label class="lb">단어</label><input class="inp" id="nwW" value="'+esc(b?b.w:token)+'">'+
    '<label class="lb">읽기</label><input class="inp" id="nwR" placeholder="かんぜい" value="'+esc(b?b.r:"")+'">'+
    '<label class="lb">뜻</label><input class="inp" id="nwKo" placeholder="관세" value="'+esc(b?b.ko:"")+'">'+
    '<div style="display:flex;gap:9px"><div style="flex:1"><label class="lb">한국 한자음</label>'+
      '<input class="inp" id="nwH" placeholder="관세" value="'+esc(b?b.hanja:"")+'"></div>'+
      '<div style="flex:1"><label class="lb">품사</label><input class="inp" id="nwP" placeholder="명사" value="'+esc(b?b.pos:"")+'"></div></div>'+
    '<label class="lb">메모</label><input class="inp" id="nwN" placeholder="輸入(ゆにゅう)과 헷갈리지 말 것" value="'+esc(b?b.note:"")+'">'+
    '<label class="lb">활용형 <span style="font-weight:500;color:var(--faint)">· 쉼표로 구분, 본문에서 같이 찾아줍니다</span></label>'+
    '<input class="inp" id="nwF" placeholder="膨らみ, 膨らんで" value="'+esc(((b&&b.forms)||[]).join(", "))+'">'+
    '<label class="lb">한자 풀이 <span style="font-weight:500;color:var(--faint)">· 한 줄에 하나: 한자 | 한국음 | 뜻 | 음독 | 훈독</span></label>'+
    '<textarea class="area" id="nwK" rows="3" placeholder="関 | 관 | 빗장, 관계하다 | カン | せき">'+esc(kan||(edit?"":autoKanjiRows(token)))+'</textarea>'+
    (edit?'':'<p class="hint" style="margin-top:6px">한자 줄은 이미 담은 단어에 적어둔 풀이를 자동으로 채웁니다. 비어 있으면 직접 적어주세요.</p>')+

          on:(p[3]||"").split(/[,、・]/).map(function(s){return s.trim();}).filter(Boolean),

      }).filter(Boolean);

        var nb=addWord(data);

    });
  setTimeout(function(){var r=$("nwR");if(r)r.focus();},60);

/* ================= 복습 ================= */
var rev=null;
function pickType(b){
  if(!b.ko)return "read";
  if((b.stage||0)>=2&&(b.occ||[]).length)return "cloze";
  if((b.stage||0)>=1&&b.r&&hasKanji(b.w))return "read";
  return "mean";
}
function studyable(b){ return !!((b.ko&&b.ko.trim())||(b.r&&b.r.trim())); }
function emptyWords(){ return bankList().filter(function(b){return b.st!==4&&!studyable(b);}); }
function revCap(){ var v=state.ui.revMax; return (v==null)?40:v; }
function buildQueue(words){
  var items=[];
  (words||dueList()).filter(studyable).forEach(function(b){items.push({kind:"word",b:b,type:pickType(b)});});
  if(!words)dueGram().forEach(function(g){items.push({kind:"gram",g:g});});
  if(!words){
    var lim=(state.ui.newMax==null)?12:state.ui.newMax;
    var fresh=lim?newList().filter(studyable).slice(0,lim):[];
    fresh.forEach(function(b){items.push({kind:"word",b:b,type:"mean",isNew:true});});
  }
  for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t;}
  var cap=revCap();
  if(!words&&cap&&items.length>cap)items=items.slice(0,cap);
  return items;
}
function startReview(words){
  var q=buildQueue(words);
  if(!q.length){toast("지금 복습할 것이 없어요");return;}
  rev={q:q,i:0,show:false,done:0,again:0,total:q.length};
  $("revWrap").className="revwrap";
  renderRev();
}
function closeRev(){
  rev=null;$("revWrap").className="revwrap hide";
  buildIndex();
  if(curArt)renderReader();
  render();
}
$("revClose").addEventListener("click",closeRev);
$("revUndo").addEventListener("click",undoGrade);
function occSentence(b){
  var occ=(b.occ||[]);
  for(var i=occ.length-1;i>=0;i--){
    var o=occ[i],a=null;
    for(var j=0;j<state.arts.length;j++)if(state.arts[j].id===o.a)a=state.arts[j];
    if(a&&a.paras[o.p]&&a.paras[o.p][o.s])return {s:a.paras[o.p][o.s],a:a};
  }
  return null;
}
function renderRev(){
  if(!rev)return;
  var body=$("revBody");
  $("revProg").style.width=(rev.i/rev.total*100)+"%";
  $("revCount").textContent=Math.min(rev.i+1,rev.total)+" / "+rev.total;
  $("revUndo").className="btn ghost mini"+(rev.last?"":" hide");
  if(rev.i>=rev.q.length){
    body.innerHTML='<div class="revdone"><div class="big">'+rev.done+'</div>'+
      '<p style="color:var(--dim);font-size:14.5px;margin:8px 0 0">끝냈어요'+(rev.again?(" · 다시 볼 것 "+rev.again+"개"):"")+'</p>'+
      '<div style="margin-top:22px;display:flex;gap:10px;justify-content:center">'+
      (dueCount()?'<button class="btn accent" data-rv="more">이어서 더 하기</button>':'')+
      '<button class="btn ghost" data-rv="close">닫기</button></div></div>';
    $("revProg").style.width="100%";
    return;
  }
  var it=rev.q[rev.i];
  if(it.kind==="gram")return renderGramCard(it);
  var b=it.b,front="",sub="",type=it.type;
  if(type==="mean"){
    front='<div class="qmain">'+esc(b.w)+'</div>';
    sub='<div class="qtype">뜻</div>';
  }else if(type==="read"){
    front='<div class="qmain">'+esc(b.w)+'</div>';
    sub='<div class="qtype">읽기</div>';
  }else{
    var oc=occSentence(b);
    if(!oc){it.type="mean";return renderRev();}
    var masked=oc.s.ja.split(b.w).join('<span class="qcloze"></span>');
    front='<div class="qmain small">'+masked+'</div>';
    sub='<div class="qtype">문장 속 빈칸</div>';
    it.sent=oc.s;
  }
  var back="";
  if(rev.show){
    var oc2=occSentence(b),exHtml=oc2?('<div class="qex">'+esc(oc2.s.ja)+(oc2.s.ko?'<span>'+esc(oc2.s.ko)+'</span>':'')+'</div>'):"";
    if(type==="mean")back='<div class="qsub">'+esc(b.r||"")+'</div><div class="qans">'+esc(b.ko||"")+'</div>'+
      (b.hanja?'<div class="qmeta">한자음 '+esc(b.hanja)+'</div>':'')+kanjiLine(b)+exHtml;
    else if(type==="read")back='<div class="qans">'+esc(b.r||"")+'</div><div class="qsub">'+esc(b.ko||"")+'</div>'+kanjiLine(b)+exHtml;
    else back='<div class="qans">'+esc(b.w)+(b.r?" · "+esc(b.r):"")+'</div>'+
      '<div class="qsub">'+esc(b.ko||"")+'</div>'+
      (it.sent&&it.sent.ko?'<div class="qmeta">'+esc(it.sent.ko)+'</div>':'');
  }
  if(rev.show&&state.ui.tts!==false&&it.kind==="word")speak(it.type==="cloze"&&it.sent?it.sent.ja:b.w);
  body.innerHTML='<div class="qcard" data-rv="flip">'+sub+front+
    (rev.show?back:'<div class="qsub" style="color:var(--faint);font-size:13px">탭하면 답이 보여요</div>')+'</div>'+
    (rev.show
      ? '<div class="revacts">'+
        '<button class="b-again" data-g="0">다시<small>10분 뒤</small></button>'+
        '<button class="b-hard" data-g="1">어려움<small>'+gradeDays(b,1)+'</small></button>'+
        '<button class="b-good" data-g="2">좋음<small>'+gradeDays(b,2)+'</small></button>'+
        '<button class="b-easy" data-g="3">쉬움<small>'+gradeDays(b,3)+'</small></button></div>'
      : '<div class="revacts"><button class="b-show" data-rv="flip">답 보기 <span class="kbd">Space</span></button></div>');
}
function kanjiLine(b){
  if(!b.kanji||!b.kanji.length)return "";
  return '<div class="qmeta">'+b.kanji.map(function(k){

  }).join("<br>")+'</div>';

function gradeDays(b,grade){
  var g=b.stage||0;
  if(grade===1)g=Math.max(0,g);else if(grade===2)g=g+1;else g=g+2;
  var d=STEPS[Math.min(g,STEPS.length-1)];
  if(grade===1)d=Math.max(1,Math.round(d*0.6));
  return d===1?"1일":(d<30?(d+"일"):(Math.round(d/30)+"달"));
}

function snapshot(o){
  return {st:o.st,stage:o.stage,due:o.due,reps:o.reps,lapses:o.lapses,last:o.last};
}
function restore(o,s2){ for(var k in s2)if(s2.hasOwnProperty(k))o[k]=s2[k]; }
function undoGrade(){
  if(!rev||!rev.last)return;
  var L=rev.last;
  restore(L.obj,L.snap);
  rev.i=L.i;rev.show=true;rev.done=L.done;rev.again=L.again;rev.q.length=L.qlen;rev.total=L.qlen;
  rev.last=null;save();renderRev();
  toast("되돌렸어요");
}
function grade(gr){
  if(!rev)return;
  var it=rev.q[rev.i];
  rev.last={obj:(it.kind==="gram"?it.g:it.b),snap:snapshot(it.kind==="gram"?it.g:it.b),
    i:rev.i,done:rev.done,again:rev.again,qlen:rev.q.length};
  if(it.kind==="gram"){
    var g=it.g;
    if(gr===0){g.stage=Math.max(0,(g.stage||0)-1);g.due=Date.now()+10*60000;rev.again++;}
    else{g.stage=Math.min((g.stage||0)+(gr===3?2:1),STEPS.length-1);g.due=Date.now()+STEPS[g.stage]*DAY;rev.done++;}
    g.reps=(g.reps||0)+1;
  }else{
    var b=it.b,fresh=(b.reps||0)===0;
    schedule(b,gr);
    if(gr===0){rev.again++;rev.q.push({kind:"word",b:b,type:it.type});rev.total=rev.q.length;}
    else rev.done++;
    bump(fresh?"nw":"rev",1);
  }
  save();
  rev.i++;rev.show=false;renderRev();
}

/* ================= 두 기기 내용 합치기 ================= */
var PREMERGE="jp2-premerge";
function mergeRemote(obj){
  if(!obj||!Array.isArray(obj.arts))return null;
  var out={added:0,changed:0,newArts:0};
  /* 단어: 더 최근에 공부한 쪽 */
  var rb=(obj.bank&&typeof obj.bank==="object")?obj.bank:{};
  Object.keys(rb).forEach(function(k){
    var r=rb[k],l=state.bank[k];
    if(!l){ state.bank[k]=r; out.added++; return; }
    if((r.last||0)>(l.last||0)){
      ["st","stage","due","reps","lapses","last"].forEach(function(f){ if(r[f]!==undefined) l[f]=r[f]; });
      out.changed++;
    }
    l.reps=Math.max(l.reps||0,r.reps||0);
    l.lapses=Math.max(l.lapses||0,r.lapses||0);
    ["r","ko","hanja","pos","jlpt","note"].forEach(function(f){ if(!String(l[f]||"").trim()&&String(r[f]||"").trim()) l[f]=r[f]; });
    if((!l.kanji||!l.kanji.length)&&r.kanji&&r.kanji.length) l.kanji=r.kanji;
    (r.forms||[]).forEach(function(f){ l.forms=l.forms||[]; if(l.forms.indexOf(f)<0) l.forms.push(f); });
    (r.occ||[]).forEach(function(o){ addOcc(l,o.a,o.p,o.s); });
  });
  /* 기사: 없는 것은 받고, 있는 것은 읽은 문단과 내 해석을 합친다 */
  var byId={};
  state.arts.forEach(function(a){ byId[a.id]=a; });
  obj.arts.forEach(function(ra){
    if(!ra||!ra.id)return;
    var la=byId[ra.id];
    if(!la){ state.arts.push(ra); out.newArts++; return; }
    Object.keys(ra.done||{}).forEach(function(k){ if(ra.done[k]) la.done[k]=1; });
    Object.keys(ra.myko||{}).forEach(function(k){
      if(!String(la.myko[k]||"").trim()||String(ra.myko[k]||"").length>String(la.myko[k]||"").length) la.myko[k]=ra.myko[k];
    });
    if(String(ra.note||"").length>String(la.note||"").length) la.note=ra.note;
    if((ra.open||0)>(la.open||0)) la.open=ra.open;
  });
  /* 문법·기록 */
  var rg=(obj.gram&&typeof obj.gram==="object")?obj.gram:{};
  Object.keys(rg).forEach(function(k){
    var r=rg[k],l=state.gram[k];
    if(!l){ state.gram[k]=r; return; }
    if((r.stage||0)>(l.stage||0)){ l.stage=r.stage; l.due=r.due; }
    l.reps=Math.max(l.reps||0,r.reps||0);
  });
  var rl=(obj.log&&typeof obj.log==="object")?obj.log:{};
  Object.keys(rl).forEach(function(k){
    var r=rl[k]||{},l=state.log[k];
    if(!l){ state.log[k]=r; return; }
    ["nw","rev","sent"].forEach(function(f){ l[f]=Math.max(l[f]||0,r[f]||0); });
  });
  if(obj.streak&&(obj.streak.n||0)>(state.streak.n||0)) state.streak=obj.streak;
  buildIndex();
  return out;
}
function snapshotBeforeMerge(){
  try{ localStorage.setItem(PREMERGE,JSON.stringify({at:Date.now(),arts:state.arts,bank:state.bank,log:state.log,gram:state.gram})); }catch(e){}
}
function hasPremerge(){ try{ return !!localStorage.getItem(PREMERGE); }catch(e){ return false; } }
function undoMerge(){
  try{
    var o=JSON.parse(localStorage.getItem(PREMERGE)||"null");
    if(!o||!o.arts){ toast("되돌릴 기록이 없어요"); return; }
    state.arts=o.arts; state.bank=o.bank||{}; state.log=o.log||{}; state.gram=o.gram||{};
    localStorage.removeItem(PREMERGE);
    buildIndex(); save(); render(); toast("합치기 전으로 되돌렸어요");
  }catch(e){ toast("되돌리지 못했어요"); }
}
function syncMerge(cb){
  if(!syncOn()){ cb&&cb(false,"동기화를 먼저 설정해주세요"); return; }
  fetch(ghUrl()+"?_="+Date.now(),{headers:ghHead(),cache:"no-store"})
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw r.status; return r.json(); })
    .then(function(j){
      if(!j){ syncPush(false,cb,true); return; }
      sync.sha=j.sha; saveSyncCfg();
      var obj=null;
      try{ obj=JSON.parse(b64dec(j.content)); }catch(e){}
      if(!obj){ cb&&cb(false,"서버 자료를 읽지 못했어요"); return; }
      snapshotBeforeMerge();
      var r2=mergeRemote(obj);
      if(!r2){ cb&&cb(false,"합칠 수 없는 자료예요"); return; }
      save(); render();
      syncPush(false,function(ok,msg){
        if(ok) cb&&cb(true,"합쳤어요 · 새 단어 "+r2.added+"개 · 갱신 "+r2.changed+"개"+(r2.newArts?(" · 새 기사 "+r2.newArts+"편"):""));
        else cb&&cb(false,msg);
      },true);
    })
    .catch(function(){ cb&&cb(false,"인터넷에 연결되지 않았어요"); });
}

// ================= 기기 간 동기화 (내 GitHub 비공개 저장소) =================
var SYNCKEY="jp2-sync";
var sync={repo:"",token:"",path:"jp2-sync.json",auto:true,sha:"",lastAt:0,lastRun:0,pendingAt:0,dev:""};
var syncBusy=false, syncTimer=null, syncDirty=false;
function loadSync(){
  try{
    var o=JSON.parse(localStorage.getItem(SYNCKEY)||"{}");
    for(var k in o) if(Object.prototype.hasOwnProperty.call(o,k)) sync[k]=o[k];
  }catch(e){}
  if(!sync.dev){ sync.dev=uid(); saveSyncCfg(); }
}
function saveSyncCfg(){ try{ localStorage.setItem(SYNCKEY,JSON.stringify(sync)); }catch(e){} }
function syncOn(){ return !!(sync.repo&&sync.token); }
function ghUrl(){ return "https://api.github.com/repos/"+sync.repo.replace(/^\/+|\/+$/g,"")+"/contents/"+sync.path; }
function ghHead(){ return {Authorization:"Bearer "+sync.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}; }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b){ return decodeURIComponent(escape(atob(String(b).replace(/\s/g,"")))); }
function syncTime(t){
  if(!t) return "아직 없음";
  var d=new Date(t), n=Date.now()-t;
  if(n<60000) return "방금";
  if(n<3600000) return Math.round(n/60000)+"분 전";
  return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function syncPayload(cb){ cb(backupObj()); }
function syncApply(obj,cb){
  if(!obj||!Array.isArray(obj.arts)){ cb(false,"서버 자료를 읽지 못했어요"); return; }
  if(!applyBackup(obj)){ cb(false,"서버 자료를 읽지 못했어요"); return; }
  var n=0; for(var k in (obj.bank||{})) if(obj.bank.hasOwnProperty(k)) n++;
  cb(true,"기사 "+obj.arts.length+"편 · 단어 "+n+"개를 내려받았어요");
}
function syncErr(st){
  if(st===401) return "토큰이 맞지 않아요";
  if(st===403) return "토큰 권한이 모자라요 (Contents 쓰기 권한)";
  if(st===404) return "저장소나 경로를 찾지 못했어요";
  return "서버 오류 ("+st+")";
}
// 내려받기
function syncPull(silent,cb){
  if(!syncOn()){ cb&&cb(false,"동기화를 먼저 설정해주세요"); return; }
  if(syncBusy){ cb&&cb(false,"동기화 중이에요"); return; }
  syncBusy=true;
  fetch(ghUrl()+"?_="+Date.now(),{headers:ghHead(),cache:"no-store"})
    .then(function(r){
      if(r.status===404){ syncBusy=false; cb&&cb(true,"서버에 아직 자료가 없어요",{empty:true}); return null; }
      if(!r.ok){ syncBusy=false; cb&&cb(false,syncErr(r.status)); return null; }
      return r.json();
    })
    .then(function(j){
      if(!j) return;
      var obj=null;
      try{ obj=JSON.parse(b64dec(j.content)); }catch(e){}
      sync.sha=j.sha; saveSyncCfg();
      if(!obj||!Array.isArray(obj.arts)){ syncBusy=false; cb&&cb(false,"서버 자료를 읽지 못했어요"); return; }
      if(silent&&!(obj.savedAt>sync.lastAt)){ syncBusy=false; cb&&cb(true,"이미 최신이에요",{same:true}); return; }
      syncApply(obj,function(ok,msg){
        if(ok){ sync.lastAt=obj.savedAt||Date.now(); sync.lastRun=Date.now(); sync.pendingAt=0; syncDirty=false; saveSyncCfg(); }
        syncBusy=false; cb&&cb(ok,msg);
      });
    })
    .catch(function(){ syncBusy=false; cb&&cb(false,"인터넷에 연결되지 않았어요"); });
}
// 올리기
function syncPush(silent,cb,force){
  if(!syncOn()){ cb&&cb(false,"동기화를 먼저 설정해주세요"); return; }
  if(syncBusy){ cb&&cb(false,"동기화 중이에요"); return; }
  if(force){
    // 서버에 있는 최신 sha 를 받아 그 위에 덮어쓴다
    fetch(ghUrl()+"?_="+Date.now(),{headers:ghHead(),cache:"no-store"})
      .then(function(r){ return r.status===404?null:(r.ok?r.json():null); })
      .then(function(j){ sync.sha=j?j.sha:""; saveSyncCfg(); syncPush(silent,cb); })
      .catch(function(){ cb&&cb(false,"인터넷에 연결되지 않았어요"); });
    return;
  }
  syncBusy=true;
  syncPayload(function(p){
    var body={message:"vocab "+new Date().toISOString(),content:b64enc(JSON.stringify(p))};
    if(sync.sha) body.sha=sync.sha;
    fetch(ghUrl(),{method:"PUT",headers:ghHead(),body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,st:r.status,j:j}; }); })
      .then(function(res){
        syncBusy=false;
        if(res.ok){
          sync.sha=res.j.content?res.j.content.sha:sync.sha;
          sync.lastAt=p.savedAt; sync.lastRun=Date.now(); sync.pendingAt=0; syncDirty=false; saveSyncCfg();
          clearTimeout(syncTimer); syncTimer=null;
          cb&&cb(true,"올렸어요"+"");
          return;
        }
        if(res.st===409||res.st===422){
          sync.sha=""; saveSyncCfg();
          cb&&cb(false,"다른 기기가 먼저 저장했어요. 내려받기를 먼저 해주세요");
          return;
        }
        cb&&cb(false,syncErr(res.st));
      })
      .catch(function(){ syncBusy=false; cb&&cb(false,"인터넷에 연결되지 않았어요"); });
  });
}
function syncAutoPush(){
  clearTimeout(syncTimer); syncTimer=null;
  syncPush(true,function(ok,msg){
    if(!ok&&/먼저 저장/.test(msg||"")) toast("다른 기기가 먼저 저장했어요 · 더보기 → 동기화에서 맞춰주세요",true);
  });
}
function syncSoon(){
  if(!syncOn()||syncBusy) return;
  syncDirty=true;
  sync.pendingAt=Date.now(); saveSyncCfg();      // 못 올린 변경이 있다는 표시
  if(!sync.auto) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncAutoPush,8000);
}
function syncFlush(){
  if(!syncOn()||!sync.auto||!syncDirty) return;
  clearTimeout(syncTimer);
  syncAutoPush();
}
// 앱을 열 때 한 번 맞추기
function syncBusyScreen(){
  if(document.getElementById("revWrap").className.indexOf("hide")<0) return true;
  if(document.getElementById("reader").className.indexOf("hide")<0) return true;
  if(document.getElementById("scrim").className.indexOf("hide")<0) return true;
  return false;
}
function syncBoot(){
  if(!syncOn()||!sync.auto||syncBusy) return;
  if(Date.now()-sync.lastRun<60000) return;     // 1분 안에 이미 맞췄으면 건너뜀
  if(syncBusyScreen()) return;
  var mine=sync.pendingAt>sync.lastAt;          // 이 기기에 아직 못 올린 변경
  fetch(ghUrl()+"?_="+Date.now(),{headers:ghHead(),cache:"no-store"})
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var theirs=0, obj=null;
      if(j){
        sync.sha=j.sha; saveSyncCfg();
        try{ obj=JSON.parse(b64dec(j.content)); }catch(e){}
        if(obj&&obj.savedAt>sync.lastAt) theirs=obj.savedAt;
      }
      if(theirs&&mine){
        if(syncBusyScreen()) return;
        toast("두 기기 내용을 합치는 중…");
        syncMerge(function(ok,msg){ toast(ok?msg:("합치지 못했어요 · "+msg),!ok); });
        return;
      }
      if(theirs&&obj){
        if(syncBusyScreen()) return;
        syncApply(obj,function(ok2){
          if(ok2){ sync.lastAt=obj.savedAt; sync.lastRun=Date.now(); sync.pendingAt=0; saveSyncCfg(); toast("다른 기기 내용으로 맞췄어요"); }
        });
        return;
      }
      if(mine) syncAutoPush();
    })
    .catch(function(){});
}

/* ================= 단축키 ================= */
document.addEventListener("keydown",function(e){
  var tag=(e.target&&e.target.tagName||"").toLowerCase();
  var typing=(tag==="input"||tag==="textarea"||tag==="select");
  if(e.key==="Escape"){
    var extra=document.querySelectorAll("body > .scrim:not(#scrim)");
    if(extra.length){var last=extra[extra.length-1];
      var btn=last.querySelector("#syncClose,#artDelCancel,.btn.ghost");
      if(btn)btn.click(); else if(last.parentNode)last.parentNode.removeChild(last);
      return;}
    if($("scrim").className.indexOf("hide")<0){closeSheet();return;}
    if($("panel").className.indexOf("hide")<0){closePanel();return;}
    if($("revWrap").className.indexOf("hide")<0){closeRev();return;}
    if($("reader").className.indexOf("hide")<0){closeReader();return;}
    return;
  }
  if($("revWrap").className.indexOf("hide")<0&&!typing){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();if(rev){rev.show=true;renderRev();}return;}
    if(rev&&rev.show&&"1234".indexOf(e.key)>-1){grade(parseInt(e.key,10)-1);return;}
    if((e.key==="z"||e.key==="Z"||e.key==="Backspace")&&rev&&rev.last){e.preventDefault();undoGrade();return;}
    return;
  }
  if($("panel").className.indexOf("hide")<0&&!typing&&"1234".indexOf(e.key)>-1){
    if(panelWord)applyStatus(panelWord,parseInt(e.key,10)-1);
    return;
  }
  if(typing)return;
  if($("scrim").className.indexOf("hide")<0)return;
  if($("reader").className.indexOf("hide")<0){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="j"||e.key==="J"){
      e.preventDefault();moveSent((e.key==="ArrowUp")?-1:1);return;
    }
    if(e.key===" "){e.preventDefault();toggleCurKo();return;}
    if(e.key==="s"||e.key==="S"){var cur=$("rBody").querySelector(".jsent.cur");
      if(cur){var ids=[cur.dataset.p,cur.dataset.s],ss=curArt.paras[ids[0]][ids[1]];if(ss)speak(ss.ja);}return;}
    if(e.key==="f"||e.key==="F"){state.ui.furi=state.ui.furi==="off"?"new":(state.ui.furi==="new"?"all":"off");save();renderReader();toast("후리가나 "+({off:"끄기",new:"모르는 단어만",all:"전부"})[state.ui.furi]);}
    else if(e.key==="k"||e.key==="K"){state.ui.ko=state.ui.ko==="show"?"hide":"show";save();renderReader();}
    return;
  }
  if(e.key==="a"||e.key==="A")openAdd();
  else if(e.key==="r"||e.key==="R")startReview();
  else if(e.key==="/"){e.preventDefault();goTab("words");setTimeout(function(){var q=$("wq");if(q)q.focus();},60);}
});
